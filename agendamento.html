<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agendamento de Atendimento — Raguife</title>
<style>
  :root{
    --green:#0f5132; --green-2:#157347; --ink:#0f172a; --muted:#64748b;
    --line:#e2e8f0; --bg:#eef4ef; --bad:#dc2626; --ok:#16a34a; --warn:#b45309; --violet:#7c3aed;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    color:var(--ink); background:radial-gradient(1200px 600px at 50% -200px,#dceede,var(--bg));
    display:flex; align-items:center; justify-content:center; padding:22px;
  }
  .card{
    width:min(520px,100%); background:#fff; border:1px solid var(--line);
    border-radius:20px; box-shadow:0 18px 50px -20px rgba(15,81,50,.35); overflow:hidden;
  }
  .top{background:var(--green); color:#fff; padding:22px 26px}
  .top img{height:30px; display:block; filter:brightness(0) invert(1)}
  .top h1{margin:14px 0 2px; font-size:19px; font-weight:800}
  .top p{margin:0; font-size:13px; opacity:.85}
  .body{padding:24px 26px 26px}
  .lbl{display:block; font-size:13px; font-weight:700; margin:0 0 6px}
  .field{
    width:100%; padding:12px 14px; font-size:15px; border:1.5px solid var(--line);
    border-radius:12px; outline:none; background:#fff; transition:border-color .15s;
  }
  .field:focus{border-color:var(--green-2)}
  textarea.field{min-height:96px; resize:vertical}
  .btn{
    width:100%; padding:13px 16px; font-size:15px; font-weight:800; color:#fff;
    background:var(--green); border:none; border-radius:12px; cursor:pointer; transition:background .15s;
  }
  .btn:hover{background:var(--green-2)}
  .btn:disabled{opacity:.6; cursor:default}
  .btn.line{background:#fff; color:var(--green); border:1.5px solid var(--line)}
  .btn.line:hover{background:#f8fafc}
  .btn.sm{width:auto; padding:9px 14px; font-size:13.5px; border-radius:10px}
  .muted{color:var(--muted)}
  .note{font-size:12.5px; color:var(--muted); margin:14px 0 0; line-height:1.5}
  .error{
    display:none; margin-top:12px; padding:10px 12px; border-radius:10px;
    background:#fef2f2; color:var(--bad); font-size:13.5px; font-weight:600;
  }
  .spec-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:2px}
  .spec{
    display:flex; align-items:center; gap:9px; padding:12px; border:1.5px solid var(--line);
    border-radius:12px; cursor:pointer; font-size:14px; font-weight:600; background:#fff; text-align:left;
  }
  .spec .ic{font-size:18px}
  .spec.on{border-width:2px}
  .reqcard{padding:16px 18px; border-radius:14px; border:1px solid var(--line); margin-bottom:12px}
  .row{display:flex; justify-content:space-between; align-items:center; gap:10px}
  .badge{font-size:12.5px; font-weight:800; padding:4px 10px; border-radius:999px; white-space:nowrap}
  .badge.pendente{background:#fff7ed; color:var(--warn)}
  .badge.confirmado{background:#f0fdf4; color:var(--ok)}
  .badge.devol{background:#f5f3ff; color:var(--violet)}
  .kv{margin-top:12px; font-size:14px}
  .kv b{display:block; font-size:12px; color:var(--muted); font-weight:700; margin-bottom:1px}
  .big-date{font-size:22px; font-weight:800; color:var(--green); margin:4px 0}
  .resched{margin-top:12px; padding:11px 13px; border-radius:11px; background:#f5f3ff; border:1px solid #ddd6fe; color:#6d28d9; font-size:13.5px; line-height:1.5}
  .resched .old{text-decoration:line-through; opacity:.7}
  .devolbox{margin-top:12px; padding:12px 14px; border-radius:12px; background:#f5f3ff; border:1px solid #ddd6fe; color:#5b21b6; font-size:13.5px; line-height:1.5}
  .notice{margin-top:16px; padding:12px 14px; border-radius:12px; background:#fffbeb; border:1px solid #fde68a; color:#92400e; font-size:12.5px; line-height:1.55}
  .center{text-align:center}
  .hide{display:none}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <img id="logo" alt="Raguife">
      <h1>Agendamento de Atendimento</h1>
      <p id="topSub">Informe seu CPF para começar.</p>
    </div>
    <div class="body" id="app"><div class="center muted">Carregando…</div></div>
  </div>

<script type="module">
import { LOGO } from './brand.js';
import { normalizeCpf, esc, escAttr } from './utils.js';
import {
  SPECIALTIES, specialtyOf, getEmployeeByCpf, getMyMedicalRequests, createMedicalRequest, getSettings
} from './db.js';

const app = () => document.getElementById('app');
const topSub = () => document.getElementById('topSub');
document.getElementById('logo').src = LOGO;

// Texto padrão do aviso, usado como retaguarda se as configurações não puderem
// ser lidas. Quando lidas, vale sempre o que o RH definiu (inclusive vazio).
const DEFAULT_NOTICE = 'A agenda pode sofrer alterações conforme a necessidade da empresa, e seu agendamento pode ser refeito. Se isso acontecer, a nova data aparece aqui ao consultar seu CPF.';

// Estado local só nesta página (nada persiste no dispositivo).
const S = { employee: null, requests: [], settings: {}, picked: '', prefillReason: '', flash: '' };

function brDate(iso){
  const p = String(iso||'').split('-');
  return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : '';
}
function noticeText(){
  const s = S.settings || {};
  const val = ('medicalScheduleNotice' in s) ? s.medicalScheduleNotice : DEFAULT_NOTICE;
  return String(val || '').trim();
}
function noticeHtml(){
  const t = noticeText();
  return t ? `<div class="notice">⚠ ${esc(t)}</div>` : '';
}

// ---------------------------------------------------------------------------
// 1) TELA DE CPF
// ---------------------------------------------------------------------------
function cpfView(){
  topSub().textContent = 'Informe seu CPF para começar.';
  app().innerHTML = `
    <label class="lbl" for="cpf">Seu CPF</label>
    <input class="field" id="cpf" inputmode="numeric" placeholder="000.000.000-00" autocomplete="off">
    <div class="error" id="err"></div>
    <button class="btn" id="go" style="margin-top:14px">Continuar</button>
    <p class="note">Usamos seu CPF apenas para localizar seu cadastro. Seus dados não são exibidos publicamente.</p>`;
  const cpf = document.getElementById('cpf');
  cpf.addEventListener('input', () => { cpf.value = maskCpf(cpf.value); });
  cpf.addEventListener('keydown', e => { if (e.key === 'Enter') lookup(); });
  document.getElementById('go').addEventListener('click', lookup);
  cpf.focus();
}
function maskCpf(v){
  const d = String(v||'').replace(/\D/g,'').slice(0,11);
  return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
}
function showErr(msg){
  const e = document.getElementById('err');
  if (e){ e.textContent = msg; e.style.display = 'block'; }
}
async function lookup(){
  const btn = document.getElementById('go');
  const raw = document.getElementById('cpf').value;
  const cpf = normalizeCpf(raw);
  if (cpf.length !== 11){ showErr('Digite os 11 números do CPF.'); return; }
  btn.disabled = true; btn.textContent = 'Consultando…';
  try{
    const emp = await getEmployeeByCpf(cpf);
    if (!emp){ btn.disabled=false; btn.textContent='Continuar'; showErr('CPF não encontrado na base. Procure o RH/DP.'); return; }
    S.employee = emp;
    [S.requests, S.settings] = await Promise.all([
      getMyMedicalRequests(emp.id),
      getSettings().catch(() => ({}))
    ]);
    hubView();
  }catch(e){
    btn.disabled=false; btn.textContent='Continuar';
    showErr('Não foi possível consultar agora. Tente novamente em instantes.');
  }
}

// Especialidades livres para um novo pedido: as que NÃO têm pedido ativo
// (pendente/confirmado). As devolvidas contam como livres — refazer sobrescreve.
function activeSpecialtyIds(){
  return (S.requests || []).filter(r => r.status !== 'devolvido').map(r => r.specialty);
}

// ---------------------------------------------------------------------------
// 2) HUB — lista dos pedidos da pessoa + botão de novo pedido
// ---------------------------------------------------------------------------
function hubView(){
  const nome = (S.employee.firstName || S.employee.name || '').split(' ')[0] || '';
  topSub().textContent = nome ? `Olá, ${nome}. Aqui estão seus atendimentos.` : 'Seus atendimentos.';

  const reqs = (S.requests || []).slice().sort((a,b) =>
    (a.status === b.status ? 0 : a.status === 'devolvido' ? -1 : a.status === 'pendente' ? 0 : 1) ||
    (b.updatedAt || 0) - (a.updatedAt || 0));

  const cards = reqs.map(reqCard).join('');
  const allTaken = activeSpecialtyIds().length >= SPECIALTIES.length && !reqs.some(r => r.status === 'devolvido');
  const flash = S.flash ? `<div class="reqcard" style="background:#f0fdf4;border-color:#bbf7d0;margin-bottom:14px"><b style="color:var(--ok)">✓ ${esc(S.flash)}</b></div>` : '';
  S.flash = '';

  app().innerHTML = `
    ${flash}
    ${cards || '<p class="note" style="margin-top:0">Você ainda não tem pedidos de atendimento.</p>'}
    ${allTaken ? '' : `<button class="btn" id="new" style="margin-top:6px">＋ Solicitar atendimento</button>`}
    ${noticeHtml()}
    <button class="btn line" id="back" style="margin-top:12px">Consultar outro CPF</button>`;

  const nb = document.getElementById('new');
  if (nb) nb.addEventListener('click', () => { S.picked=''; S.prefillReason=''; formView(); });
  document.getElementById('back').addEventListener('click', resetToCpf);
  // Botões "Refazer pedido" nas cartas devolvidas.
  app().querySelectorAll('[data-redo]').forEach(b =>
    b.addEventListener('click', () => {
      const r = (S.requests || []).find(x => x.specialty === b.dataset.redo && x.status === 'devolvido');
      S.picked = b.dataset.redo; S.prefillReason = r ? r.reason : ''; formView();
    }));
}

function reqCard(r){
  const sp = specialtyOf(r.specialty);
  const confirmed = r.status === 'confirmado';
  const devol = r.status === 'devolvido';
  const badge = confirmed ? '<span class="badge confirmado">✓ Confirmado</span>'
    : devol ? '<span class="badge devol">↩ Devolvido</span>'
    : '<span class="badge pendente">● Aguardando</span>';

  let body = '';
  if (confirmed){
    body = `
      ${r.rescheduled && r.previousDate ? `<div class="resched"><b>↻ Seu atendimento foi remarcado.</b><br>
        Nova data acima. Antes era <span class="old">${esc(brDate(r.previousDate))}${r.previousStartTime ? ' · ' + esc(r.previousStartTime) : ''}</span>.</div>` : ''}
      <div class="kv"><b>Data e horário</b>
        <div class="big-date">${esc(brDate(r.date))}${r.startTime ? ' · ' + esc(r.startTime) : ''}</div></div>
      ${r.place ? `<div class="kv"><b>Local</b>${esc(r.place)}</div>` : ''}
      ${r.rhNote ? `<div class="kv"><b>Orientação do RH</b>${esc(r.rhNote)}</div>` : ''}`;
  } else if (devol){
    body = `
      <div class="devolbox"><b>O RH precisa de mais informações:</b><br>${esc(r.rhQuestion || 'Detalhe melhor o seu pedido.')}</div>
      <button class="btn sm" data-redo="${escAttr(r.specialty)}" style="margin-top:12px">Refazer pedido</button>`;
  } else {
    body = `<p class="note">Seu pedido foi recebido e está aguardando o RH definir a data. Volte aqui e consulte seu CPF para ver a confirmação.</p>`;
  }

  return `<div class="reqcard" style="border-left:5px solid ${sp.color}">
    <div class="row">
      <b style="color:${sp.color};font-size:15px">${sp.icon} ${esc(sp.name)}</b>
      ${badge}
    </div>
    ${r.reason ? `<div class="kv"><b>Motivo</b>${esc(r.reason)}</div>` : ''}
    ${body}
  </div>`;
}

// ---------------------------------------------------------------------------
// 3) FORMULÁRIO DO PEDIDO (novo ou refazendo um devolvido)
// ---------------------------------------------------------------------------
function formView(){
  const nome = (S.employee.firstName || S.employee.name || '').split(' ')[0] || '';
  topSub().textContent = nome ? `Olá, ${nome}. Escolha o atendimento desejado.` : 'Escolha o atendimento desejado.';

  const taken = activeSpecialtyIds();
  // Mostra as especialidades livres + a que está sendo refeita (devolvida).
  const options = SPECIALTIES.filter(sp => !taken.includes(sp.id) || sp.id === S.picked);
  const specs = options.map(sp => `
    <button type="button" class="spec ${S.picked===sp.id?'on':''}" data-id="${escAttr(sp.id)}"
      style="${S.picked===sp.id?`border-color:${sp.color};background:${sp.color}10;color:${sp.color}`:''}">
      <span class="ic">${sp.icon}</span><span>${esc(sp.name)}</span></button>`).join('');

  app().innerHTML = `
    <label class="lbl">Especialidade</label>
    <div class="spec-grid" id="specs">${specs || '<p class="note" style="margin:0">Você já tem pedidos em todas as especialidades.</p>'}</div>
    <label class="lbl" style="margin-top:18px" for="reason">Motivo do atendimento</label>
    <textarea class="field" id="reason" placeholder="Descreva brevemente o que você precisa (sintomas, exame, retorno…). Quanto mais claro, mais rápido o RH encaminha.">${esc(S.prefillReason || '')}</textarea>
    <div class="error" id="err"></div>
    <button class="btn" id="send" style="margin-top:16px">Enviar pedido</button>
    <button class="btn line" id="cancel" style="margin-top:10px">Voltar</button>
    <p class="note">Após enviar, o RH define a data e o horário — ou pode devolver pedindo mais detalhes. Você acompanha por aqui consultando seu CPF.</p>`;

  app().querySelectorAll('.spec').forEach(b =>
    b.addEventListener('click', () => { S.picked = b.dataset.id; S.prefillReason = document.getElementById('reason').value; formView(); }));
  document.getElementById('send').addEventListener('click', send);
  document.getElementById('cancel').addEventListener('click', () => { S.picked=''; S.prefillReason=''; hubView(); });
}

async function send(){
  const reason = document.getElementById('reason').value.trim();
  if (!S.picked){ showErr('Escolha a especialidade.'); return; }
  if (!reason){ showErr('Descreva o motivo do atendimento.'); return; }
  const btn = document.getElementById('send');
  btn.disabled = true; btn.textContent = 'Enviando…';
  try{
    const res = await createMedicalRequest(S.employee, S.picked, reason);
    if (!res.ok && res.reason === 'exists'){
      // Já existe um pedido ativo dessa especialidade — recarrega e volta ao hub.
      S.requests = await getMyMedicalRequests(S.employee.id);
      S.picked=''; S.prefillReason=''; S.flash=''; hubView();
      return;
    }
    S.requests = await getMyMedicalRequests(S.employee.id);
    S.picked=''; S.prefillReason=''; S.flash = 'Pedido enviado!';
    hubView();
  }catch(e){
    btn.disabled=false; btn.textContent='Enviar pedido';
    showErr('Não consegui enviar agora. Tente novamente em instantes.');
  }
}

function resetToCpf(){
  S.employee=null; S.requests=[]; S.settings={}; S.picked=''; S.prefillReason=''; S.flash='';
  cpfView();
}

// Início
cpfView();
</script>
</body>
</html>
