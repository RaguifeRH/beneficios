<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raguife · RH / DP</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ===========================================================================
   Painel RH/DP — visual "Jornal de bolso" (v2).
   Design system Raguife (Poppins, verde #024F2B, verde-claro #9DCD46, blocos de
   cantos retos) + linguagem do Jornal (faixa verde com textura, títulos grandes
   em caixa alta, traço lima antes dos rótulos, uma cor por seção).
   =========================================================================== */
:root{
  --verde:#024f2b; --verde-esc:#01361d; --lima:#9dcd46; --lima-cl:#cfe6a8; --oliva:#739630; --oliva-esc:#5c7a22; --lima-bg:#e7f2d2;
  --ink:#15201a; --muted:#5d6a62; --line:#dde5de; --line2:#eef3ef; --mist:#f2f5f0;
  --bad:#b3372f; --badSoft:#fbecea; --warn:#9a6a08; --warnSoft:#fdf3dc; --ok:#1f7a45; --okSoft:#e3f2e7;
  --tex:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0,rgba(255,255,255,.035) 2px,transparent 2px,transparent 14px);
  --font:Poppins,system-ui,sans-serif; --display:Poppins,system-ui,sans-serif; --body:Poppins,system-ui,sans-serif;
  /* nomes antigos, mantidos para estilos inline existentes */
  --primary:#024f2b; --soft:#e4f1e8; --accent:#739630; --accentSoft:#e7f2d2;
  --rh-canvas:#f2f5f0; --rh-paper:#fff; --rh-ink:#15201a; --rh-muted:#5d6a62; --rh-line:#dde5de; --rh-line2:#eef3ef;
  --rh-forest:#024f2b; --rh-pine:#01361d; --rh-olive:#739630; --rh-olive-soft:#e7f2d2;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--mist);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;
  font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* rótulo curto com o traço lima */
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--oliva-esc)}
.eyebrow:before{content:"";width:22px;height:3px;background:var(--oliva);flex:none}

/* ---------- Login ---------- */
.rh-login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--verde);background-image:var(--tex)}
.rh-login-card{background:#fff;padding:36px 32px;width:min(420px,100%);text-align:left;box-shadow:0 30px 70px rgba(0,0,0,.25)}
.rh-login-card img{height:44px;width:auto;margin:0 0 26px;display:block}
.rh-login-card h1{color:var(--verde);font-size:30px;line-height:32px;margin:6px 0 8px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em}
.rh-login-card p{color:var(--muted);font-size:14px;margin:0 0 22px;line-height:1.5}
.rh-login-card .field{margin-bottom:10px}
.rh-login-card .eyebrow{justify-content:flex-start}

/* ---------- Shell ---------- */
.rh-shell{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.rh-side{background:var(--verde-esc);color:#fff;padding:22px 16px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.rh-side .logo{padding:0 4px 8px;margin-bottom:10px}
.rh-side .logo img{height:36px;width:auto;display:block;background:#fff;padding:4px}
.rh-side nav{display:flex;flex-direction:column;gap:14px;flex:1;overflow:auto;padding-top:6px}
.rh-side nav::-webkit-scrollbar{width:0}
.nav-group{display:flex;flex-direction:column;gap:1px}
.nav-eyebrow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:#8fb39a;padding:2px 12px 6px}
.rh-side nav button{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;
  border-left:3px solid transparent;color:#cfe0d4;font-weight:500;font-size:14px;padding:10px 12px;cursor:pointer;transition:background .15s,color .15s}
.rh-side nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.rh-side nav button.active{background:rgba(255,255,255,.1);color:#fff;font-weight:600;border-left-color:var(--lima)}
.rh-side nav button .ic{width:20px;height:20px;display:grid;place-items:center;color:#9fbfa9;flex:none}
.rh-side nav button.active .ic,.rh-side nav button:hover .ic{color:var(--lima)}
.rh-side nav button .ic svg{width:19px;height:19px}
.rh-side .who{border-top:1px solid rgba(255,255,255,.14);padding-top:14px;margin-top:8px}
.who-id{display:flex;align-items:center;gap:10px;padding:0 4px 10px}
.who-av{width:36px;height:36px;background:var(--lima);color:var(--verde-esc);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.who-tx{min-width:0}
.who-tx b{display:block;font-size:12.5px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-tx span{font-size:11px;color:#a9c4b1}
.rh-side .who button{width:100%;background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;padding:9px;font-weight:600;font-size:12.5px;cursor:pointer}
.rh-side .who button:hover{background:rgba(255,255,255,.08)}

/* Conteúdo */
.rh-main{padding:30px 36px 48px;max-width:1240px;width:100%}
.rh-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.rh-head h1{font-size:32px;line-height:34px;color:var(--verde);margin:6px 0 0;font-weight:800;text-transform:uppercase;letter-spacing:-.01em}
.rh-head p{color:var(--muted);margin:8px 0 0;font-size:14px;max-width:70ch;line-height:1.5}

/* Faixa de boas-vindas do painel */
.hero{background:var(--verde);background-image:var(--tex);color:#fff;padding:28px 32px;margin:-30px -36px 26px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.hero .eyebrow{color:var(--lima-cl)}.hero .eyebrow:before{background:var(--lima)}
.hero h1{margin:8px 0 6px;font-size:38px;line-height:40px;font-weight:800;text-transform:uppercase;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--lima)}
.hero p{margin:0;font-size:14.5px;color:#d9e6dc}
.hero p b{color:#fff}

/* ---------- Form & botões ---------- */
.field{width:100%;border:1px solid #c9d5cc;background:#fff;border-radius:0;padding:11px 13px;font-size:14px;color:var(--ink);outline:none;transition:border .15s,box-shadow .15s}
.field:focus{border-color:var(--verde);box-shadow:0 0 0 3px rgba(2,79,43,.12)}
label.lbl,.lbl{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.1em}
.btn{border:0;background:var(--verde);color:#fff;border-radius:0;padding:11px 18px;min-height:44px;font-weight:700;font-size:14px;cursor:pointer;transition:background .15s;line-height:1.2}
.btn:hover{background:#036c3b}
.btn:disabled{opacity:.55;cursor:default}
.btn.secondary{background:var(--lima-bg);color:var(--verde)}
.btn.line{background:#fff;color:var(--verde);border:1px solid #c9d5cc}
.btn.line:hover{background:#f6f9f6;border-color:var(--verde)}
.btn.danger{background:var(--badSoft);color:#9b2c24}
.btn.danger:hover{background:#f6dcd9}
.btn.sm{padding:7px 12px;min-height:36px;font-size:13px}
.error{display:none;background:var(--badSoft);color:var(--bad);padding:11px 13px;margin-top:12px;font-size:13px;font-weight:600}

/* ---------- KPIs ---------- */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:24px}
.kpi{background:#fff;border:1px solid var(--line);border-top:6px solid var(--verde);padding:16px 20px}
.kpi b{display:block;font-size:36px;line-height:40px;color:var(--verde);font-weight:800}
.kpi span{display:block;margin-top:4px;font-size:12.5px;color:var(--muted);font-weight:500}

/* ---------- Painéis ---------- */
.panel{background:#fff;border:1px solid var(--line);margin-bottom:22px}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line2);gap:12px;flex-wrap:wrap}
.panel-head h2{font-size:13px;margin:0;color:var(--verde);font-weight:700;text-transform:uppercase;letter-spacing:.12em}
.panel-body{padding:20px}

/* Lista "O que precisa de você" */
.todo{display:flex;align-items:center;gap:16px;padding:15px 20px;border-bottom:1px solid var(--line2);background:#fff;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer;color:var(--ink)}
.todo:last-child{border-bottom:0}
.todo:hover{background:#f7faf6}
.todo .n{width:44px;height:44px;flex:none;color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.todo .t{flex:1;display:flex;flex-direction:column;gap:2px}
.todo .t b{font-size:14.5px}
.todo .t span{font-size:12.5px;color:var(--muted)}
.todo.done .n{background:var(--line)!important;color:var(--muted)}

/* Cartões de benefício (grade) */
.ben-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;padding:18px 20px}
.bcard{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column}
.bcard .band{height:6px}
.bcard .bb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.bcard .top{display:flex;gap:12px;align-items:center}
.bcard .cat{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.bcard h3{margin:1px 0 0;font-size:15px;line-height:20px}
.bcard .prof{font-size:12.5px;line-height:18px;color:var(--muted)}
.bcard .tags{display:flex;gap:5px;flex-wrap:wrap}
.bcard .acts{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.bcard .ro{font-size:12px;color:var(--muted);margin-top:auto}

/* ---------- Tabelas ---------- */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:12px 18px;border-bottom:1px solid var(--line);font-weight:700;background:#f7faf6}
td{padding:13px 18px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr:hover td{background:#f7faf6}
.muted{color:var(--muted)}
.empty{padding:40px 24px;text-align:center;color:var(--muted);font-size:14px}
.row-actions{display:flex;gap:6px;justify-content:flex-end}

/* tags / status */
.tag{display:inline-flex;align-items:center;padding:3px 8px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tag.on{background:var(--okSoft);color:var(--ok)}
.tag.off{background:#eef1ee;color:var(--muted)}
.tag.warn{background:var(--warnSoft);color:var(--warn)}
.tag.draft{background:#eef1ee;color:var(--muted)}
.tag.open{background:var(--okSoft);color:var(--ok)}
.tag.closed{background:var(--warnSoft);color:var(--warn)}
.tag.drawn{background:#e6eefb;color:#2c5ca8}
.tag.published{background:var(--lima-bg);color:#3f5a10}
.tag.unit{background:#e6eefb;color:#2c5ca8;text-transform:none;letter-spacing:0}

/* ---------- Form grid / chips ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.form-grid .full{grid-column:1/-1}
.form-grid textarea.field{min-height:84px;resize:vertical;line-height:1.5}
.check{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500;color:var(--ink)}
.check input{width:18px;height:18px;accent-color:var(--verde)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #c9d5cc;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;user-select:none;transition:.12s;color:var(--ink);background:#fff;min-height:38px}
.chip:hover{border-color:var(--verde)}
.chip.on{background:var(--verde);color:#fff;border-color:var(--verde)}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(1,20,10,.55);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:#fff;width:min(720px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.34)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;background:var(--verde);color:#fff;position:sticky;top:0;z-index:2}
.modal-head h2{font-size:18px;margin:0;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.modal-head button.x{background:transparent;border:0;font-size:26px;cursor:pointer;color:#fff;line-height:1;width:40px;height:40px}
.modal-body{padding:22px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line2);position:sticky;bottom:0;background:#fff}

.icon-box{width:52px;height:52px;display:grid;place-items:center;overflow:hidden;color:#fff;font-size:26px;flex:none}
.icon-box.contain{padding:5px;background:#fff!important;border:1px solid var(--line)}
.icon-box.contain img{max-width:100%;max-height:100%;object-fit:contain}
.icon-box.cover img{width:100%;height:100%;object-fit:cover}

.hint{font-size:13px;color:var(--ink);background:var(--lima-bg);padding:12px 14px;margin-bottom:16px;line-height:1.55}
.dropzone{display:block;width:100%;border:3px dashed #9fb8a6;padding:36px 20px;text-align:center;color:var(--muted);cursor:pointer;line-height:1.6;transition:.15s;background:#fff}
.dropzone:hover{border-color:var(--verde);background:#f7faf6;color:var(--ink)}

.link-row,.film-row{display:flex;gap:8px;margin-bottom:8px}

/* ---------- Responsivo: vira topo no celular ---------- */
@media (max-width:900px){
  .rh-shell{grid-template-columns:1fr}
  .rh-side{position:sticky;top:0;height:auto;flex-direction:column;padding:12px 12px 8px;z-index:20}
  .rh-side .logo{padding:2px 4px}
  .rh-side .logo img{height:30px}
  .rh-side nav{flex-direction:row;gap:8px;overflow-x:auto;padding:8px 2px}
  .nav-group{flex-direction:row;gap:6px}
  .nav-eyebrow{display:none}
  .rh-side nav button{width:auto;white-space:nowrap;padding:8px 12px;border-left:0;border-bottom:3px solid transparent}
  .rh-side nav button.active{border-bottom-color:var(--lima)}
  .rh-side .who{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:0;padding-top:8px;margin-top:0}
  .who-id{padding:0}
  .rh-side .who button{width:auto;padding:8px 14px}
  .rh-main{padding:22px 16px 40px}
  .hero{margin:-22px -16px 22px;padding:22px 16px}
  .form-grid{grid-template-columns:1fr}
  .rh-head h1{font-size:26px;line-height:28px}
}

/* === Agenda Médica — calendário de cadastro (baseado no protótipo) === */
.ag{background:#fff;border:1px solid var(--rh-line);border-radius:0;overflow:hidden;margin-bottom:18px}
.ag-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--rh-line)}
.ag-title{display:flex;align-items:center;gap:12px;margin-right:auto}
.ag-badge{width:44px;height:44px;border-radius:50%;border:2px solid var(--rh-olive);display:grid;place-items:center;font-size:21px;flex:none}
.ag-title h3{margin:0;font-family:var(--display);font-size:20px;line-height:1.05;color:var(--rh-forest);text-transform:uppercase;letter-spacing:.01em}
.ag-title span{display:block;font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--rh-muted);text-transform:uppercase;margin-top:3px}
.ag-nav{display:flex;align-items:center;gap:8px}
.ag-nav b{min-width:150px;text-align:center;font-family:var(--display);font-size:16px;color:var(--rh-forest)}
.ag-nav button{border:1px solid var(--rh-line);background:#fff;color:var(--rh-forest);width:32px;height:32px;border-radius:9px;font-weight:900;font-size:16px;cursor:pointer}
.ag-nav button:hover{background:var(--rh-canvas)}
.ag-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.ag-wd{background:var(--rh-forest);color:#fff;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;text-align:center;padding:9px 0}
.ag-cell{min-height:116px;border-right:1px solid var(--rh-line);border-bottom:1px solid var(--rh-line);padding:6px 6px 8px;position:relative;background:#fff;cursor:pointer;text-align:left}
.ag-cell:nth-child(7n){border-right:0}
.ag-cell.out{background:#fafbfa;cursor:default}
.ag-cell:not(.out):hover{background:#f4f8f3}
.ag-day{font-size:12.5px;font-weight:800;color:var(--rh-ink)}
.ag-cell.today .ag-day{background:var(--rh-forest);color:#fff;border-radius:6px;padding:1px 6px}
.ag-add{position:absolute;right:6px;top:5px;opacity:0;font-size:16px;line-height:1;color:var(--rh-forest);font-weight:900;transition:.15s}
.ag-cell:not(.out):hover .ag-add{opacity:.7}
.ag-chip{display:block;width:100%;text-align:left;border:0;border-left:3px solid;border-radius:5px;padding:4px 6px;margin-top:4px;font:inherit;cursor:pointer}
.ag-chip b{display:block;font-size:10.5px;font-weight:800;line-height:1.25}
.ag-chip span{display:block;font-size:9.5px;opacity:.8;margin-top:1px}
.ag-chip.off{opacity:.42}
.ag-legend{display:flex;flex-wrap:wrap;gap:12px 22px;padding:15px 20px;border-top:1px solid var(--rh-line);background:#fff}
.ag-legend .lbl{width:100%;margin:0 0 2px}
.ag-leg{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--rh-ink)}
.ag-dot{width:11px;height:11px;border-radius:50%;flex:none}
.ag-empty{padding:14px 20px;font-size:13px;color:var(--rh-muted);border-top:1px solid var(--rh-line)}

.ag-logo,.ag-foot{display:none}
@media print{
  .rh-side,.rh-head,.ag-actions,.ag-add,.hint,.modal-bg,.ag-nav button{display:none!important}
  .ag-logo{display:block;height:34px;width:auto;margin-left:auto}
  .ag-foot{display:block;text-align:center;padding:13px;font-size:9.5px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--rh-muted);border-top:1px solid var(--rh-line)}
  .ag-nav b{min-width:0}
  .rh-main{padding:0!important;margin:0!important}
  .rh-shell{display:block!important}
  .ag{border:0;margin:0}
  .ag-cell{min-height:96px}
  @page{size:A4 landscape;margin:8mm}
}
</style></head><body>
<div id="root"><div class="rh-login"><div class="rh-login-card"><h1>Carregando…</h1></div></div></div>
<div class="toast" id="toast"></div>
<script type="module">
// ============================================================================
// rh.js — Área RH/DP (desktop-first).
// Núcleo compartilhado agora vive em firebase.js / utils.js / db.js / brand.js.
// Antes esses ~450 linhas eram COPIADAS aqui e no outro HTML, e as cópias já
// tinham divergido. Uma única fonte de verdade evita que isso volte a acontecer.
// ============================================================================

import { LOGO, LOGO_WHITE } from './brand.js';
import {
  CARD_COLORS, cpfSafe, dt, esc, escAttr, id, isLightColor,
  nowLocalForInput, readFileDataURL, toast
} from './utils.js';
import { auth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createAuthUser } from './firebase.js';

// Login real via Firebase Authentication (e-mail + senha). Cada usuário do
// painel tem um cadastro em admins/{uid} que diz a filial dele:
//   - filial vazia  = MATRIZ: vê e gerencia tudo;
//   - filial preenchida = RH DA FILIAL: vê e gerencia só a própria filial

// --- Papel do usuário logado -------------------------------------------------
function myUnit() { return String(S.admin?.unit || '').trim(); }
function isMatriz() { return !!S.admin && !myUnit(); }
// Escopo usado nas consultas: '' = tudo (matriz) ou a filial do usuário.
function scopeUnit() { return isMatriz() ? '' : myUnit(); }
function scopeLabel() { return isMatriz() ? 'Matriz' : myUnit(); }
// Filiais com RH próprio (os "apartamentos"), conforme os usuários cadastrados.
function independentUnits() { return DB.independentUnits(S.admins); }
// A qual escopo pertence uma filial: ela mesma (se tem RH próprio) ou a matriz ('').
function scopeOfUnit(u) {
  const hit = independentUnits().find(x => DB.sameUnit(x, u));
  return hit || '';
}
function unitTag(u) {
  return `<span class="tag unit">${esc(u || 'Matriz')}</span>`;
}
// Registro de auditoria já com a filial de quem fez.
function logAudit(entry) {
  return DB.logAudit({ unit: myUnit(), ...entry });
}

const NAV = [
  { group: 'Geral', items: [['dashboard', 'Painel']] },
  { group: 'Conteúdo', items: [['benefits', 'Benefícios'], ['medical', 'Atendimentos'], ['requests', 'Agendamentos'], ['suggestions', 'Sugestões'], ['raffles', 'Sorteios'], ['communication', 'Comunicado']] },

  { group: 'Sistema', items: [['users', 'Usuários'], ['settings', 'Configurações'], ['audit', 'Auditoria']] }
];
// Abas do RH de filial. As demais (sorteio, atendimentos, configurações,
// usuários, auditoria) são só da matriz.
const FILIAL_TABS = ['dashboard', 'benefits', 'suggestions', 'communication', 'employees', 'profiles', 'rules', 'imports'];
function tabAllowed(tab) { return isMatriz() || FILIAL_TABS.includes(tab); }
function navGroups() {
  return NAV.map(g => ({ group: g.group, items: g.items.filter(([k]) => tabAllowed(k)) }))
    .filter(g => g.items.length);
}
const TAB_LABEL = Object.fromEntries(NAV.flatMap(g => g.items.map(([k, l]) => [k, l])));
const TAB_GROUP = Object.fromEntries(NAV.flatMap(g => g.items.map(([k]) => [k, g.group])));

// --- Auth --------------------------------------------------------------------
onAuthStateChanged(auth, async (user) => {
  S.user = user; S.admin = null;
  if (!user) { render(); return; }
  // Sem cadastro ativo em admins/{uid}, estar logado não dá acesso.
  const admin = await DB.getAdmin(user.uid).catch(() => null);
  if (!admin || admin.active === false) { root().innerHTML = noAccessView(user, admin); return; }
  S.admin = admin;
  if (!tabAllowed(S.tab)) S.tab = 'dashboard';
  try { await loadAll(); render(); }
  catch (e) {
    root().innerHTML = `<div class="rh-login"><div class="rh-login-card">
      <h1>Quase lá…</h1>
      <p>O login funcionou, mas não consegui acessar o banco de dados.</p>
      <p style="font-size:13px;color:var(--bad);font-weight:700">Provável causa: o Firestore ainda não foi criado, ou as regras (firestore.rules) não foram publicadas no console do Firebase.</p>
      <button class="btn" style="width:100%;margin-top:12px" onclick="window.__logout()">Sair e tentar de novo</button>
      <p style="font-size:11px;color:var(--muted);margin-top:10px">Detalhe técnico: ${esc(e?.message || e)}</p>
    </div></div>`;
  }
});

// Tela para quem entrou com e-mail/senha mas não tem acesso liberado. Mostra o
// UID, que é o que a matriz (ou o console do Firebase) precisa para liberar.
function noAccessView(user, admin) {
  const off = admin && admin.active === false;
  return `<div class="rh-login"><div class="rh-login-card">
    <img src="${escAttr(LOGO_BOX)}" alt="Raguife">
    <h1>${off ? 'Acesso desativado' : 'Acesso não liberado'}</h1>
    <p>${off
      ? 'Seu usuário do painel foi desativado. Fale com o RH da matriz.'
      : 'Seu login funcionou, mas ainda não foi liberado no painel. Envie o código abaixo para o RH da matriz.'}</p>
    <div style="text-align:left;background:#f6faf2;border:1px solid var(--rh-line);border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:12px">
      <div class="lbl" style="margin-bottom:2px">E-mail</div><div style="margin-bottom:10px">${esc(user.email || '')}</div>
      <div class="lbl" style="margin-bottom:2px">Código (UID)</div>
      <code id="uidCode" style="word-break:break-all;font-weight:800">${esc(user.uid)}</code>

    <button class="btn" style="width:100%" onclick="window.__logout()">Sair</button>
  </div></div>`;

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    await DB.logAudit({ action: 'login', entity: 'auth', userEmail: email });
  } catch (e) {
    err.style.display = 'block';
    err.textContent = authError(e);
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}
function authError(e) {
  const c = String(e?.code || '');
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found'))
    return 'E-mail ou senha incorretos.';
  if (c.includes('too-many-requests')) return 'Muitas tentativas. Aguarde alguns minutos.';
  if (c.includes('network')) return 'Sem conexão. Verifique sua internet.';
  return 'Não foi possível entrar. Detalhe: ' + (e?.code || e?.message || e);
}
async function doLogout() { await signOut(auth); }

const EMPTY_COMM = { imageBase64: '', active: false, id: '' };

async function loadAll() {
  S.settings = await DB.getSettings();
  if (isMatriz()) {
    S.profiles = await DB.seedProfilesIfEmpty();
    S.raffles = await DB.listRaffles();
    S.admins = await DB.listAdmins();
    S.commTarget = '';
    S.communication = await DB.getCommunication() || { ...EMPTY_COMM };
  } else {
    S.profiles = await DB.listProfiles();
    S.raffles = [];
    S.admins = [];
    S.commTarget = myUnit();
    S.communication = await DB.getUnitCommunication(myUnit()) || { ...EMPTY_COMM };
  }
  S.benefits = await DB.listBenefits();
  S.employees = await DB.listEmployees(scopeUnit());
  // Para a lista "O que precisa de você" do painel.
  S.requests = isMatriz() ? await DB.listMedicalRequests().catch(() => []) : [];
  S.suggestions = await DB.listSuggestions(scopeUnit()).catch(() => []);
}
async function refreshTabData() {
  const U = scopeUnit();
  if (S.tab === 'dashboard') {
    S.employees = await DB.listEmployees(U);
    S.suggestions = await DB.listSuggestions(U).catch(() => []);
    if (isMatriz()) { S.requests = await DB.listMedicalRequests().catch(() => []); S.raffles = await DB.listRaffles(); }
  }
  if (S.tab === 'employees') S.employees = await DB.listEmployees(U);
  if (S.tab === 'imports') S.imports = await DB.listImports(U);
  if (S.tab === 'audit') S.audit = await DB.listAudit();
  if (S.tab === 'profiles') S.profiles = await DB.listProfiles();
  if (S.tab === 'rules') { S.rules = await DB.listProfileRules(); S.profiles = await DB.listProfiles(); }
  if (S.tab === 'benefits') { S.benefits = await DB.listBenefits(); S.employees = await DB.listEmployees(U); S.profiles = await DB.listProfiles(); }
  if (S.tab === 'raffles') { S.raffles = await DB.listRaffles(); S.employees = await DB.listEmployees(U); }
  if (S.tab === 'medical') { S.medical = await DB.listMedicalSlots(); S.employees = await DB.listEmployees(U); }
  if (S.tab === 'requests') S.requests = await DB.listMedicalRequests();
  if (S.tab === 'suggestions') S.suggestions = await DB.listSuggestions(U);
  if (S.tab === 'settings') S.employees = await DB.listEmployees(U);
  if (S.tab === 'users') { S.admins = await DB.listAdmins(); S.employees = await DB.listEmployees(U); }
  if (S.tab === 'communication' && isMatriz()) { S.admins = await DB.listAdmins(); S.employees = await DB.listEmployees(U); }
}
async function goTab(tab) {
  if (!tabAllowed(tab)) tab = 'dashboard';
  S.tab = tab; await refreshTabData(); render();
}

// BENEFÍCIOS
// ============================================================================
// O que cada um enxerga: matriz = tudo; filial = o que aparece para a filial
// (os dela, editáveis, e os da matriz liberados para ela, só leitura).
function visibleBenefits() {
  if (isMatriz()) return S.benefits;
  return S.benefits.filter(b => ownsBenefit(b) || DB.unitAllowed(b.units, myUnit()));
}
// Filial dona do benefício: a gravada em ownerUnit ou, para benefícios antigos
// (cadastrados antes da separação), a única filial que vê o benefício.
function benefitOwner(b) {
  if (b.ownerUnit) return b.ownerUnit;
  const u = Array.isArray(b.units) && b.units.length === 1 ? b.units[0] : '';
  return u && independentUnitsOrMine().some(x => DB.sameUnit(x, u)) ? u : '';
}
function independentUnitsOrMine() {
  return isMatriz() ? independentUnits() : [myUnit()];
}
function ownsBenefit(b) {
  return isMatriz() || DB.sameUnit(benefitOwner(b), myUnit());
}
// Abas da lista de benefícios: "Todas as filiais" (liberados para todos) e uma
// aba por filial com os benefícios restritos a ela. Um benefício liberado para
// duas filiais aparece nas duas abas.
const BEN_ALL = '__all__';
function benefitTabs() {
  if (!isMatriz()) return [myUnit(), BEN_ALL];
  const seen = new Map();
  const add = u => { const k = DB.normKey(u); if (k && !seen.has(k)) seen.set(k, String(u).trim()); };
  knownUnits().forEach(add);
  S.benefits.forEach(b => (b.units || []).forEach(add));
  return [BEN_ALL, ...[...seen.values()].sort((a, b) => a.localeCompare(b))];
}
function currentBenTab() {
  const tabs = benefitTabs();

// Filiais distintas encontradas na base de funcionários (fonte do seletor).
// Vem da própria base para não haver erro de digitação que quebre o filtro.
// Na matriz, entram também as filiais com RH próprio (mesmo antes da 1ª importação).
function knownUnits() {
  const seen = new Map(); // normalizado -> rótulo original (o 1º que aparecer)
  const add = v => {
    const u = String(v || '').trim();
    if (!u) return;
    const k = DB.normKey(u);
    if (!seen.has(k)) seen.set(k, u);
  };
  (S.employees || []).forEach(e => add(e.unit));
  if (isMatriz()) (S.admins || []).forEach(a => add(a.unit));
  else add(myUnit());
  return [...seen.values()].sort((a, b) => a.localeCompare(b));
}
function benefitUnit(i) {
  const units = knownUnits();
  const u = units[i]; if (u == null) return;
  const arr = S.editingBenefit.units || [];
  const on = arr.some(x => DB.normKey(x) === DB.normKey(u));
  S.editingBenefit.units = on ? arr.filter(x => DB.normKey(x) !== DB.normKey(u)) : [...arr, u];
  syncBenefitForm(); render();
}
// Redimensiona e comprime uma imagem antes de gravar como base64.
// O Firestore limita cada documento a ~1MB; imagens grandes (arte do Canva, etc.)
// estouravam esse teto. Aqui reduzimos o maior lado até maxDim px e re-encodamos
// como JPEG, baixando a qualidade em passos até caber com folga em maxBytes.
function compressImageFile(file, { maxDim = 1280, maxBytes = 600 * 1024 } = {}) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width >= height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height > width && height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, width, height); // fundo branco p/ transparência (PNG)
        ctx.drawImage(img, 0, 0, width, height);
        // base64 ocupa ~4/3 do tamanho binário: estima os bytes reais do data URL.
        const bytesOf = (u) => Math.ceil((u.length - (u.indexOf(',') + 1)) * 3 / 4);
        let q = 0.85, out = canvas.toDataURL('image/jpeg', q);
        while (bytesOf(out) > maxBytes && q > 0.4) { q -= 0.1; out = canvas.toDataURL('image/jpeg', q); }
        resolve(out);
      };
      img.onerror = () => reject(new Error('imagem inválida'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('falha ao ler arquivo'));
    reader.readAsDataURL(file);
  });
}
async function benefitIcon(input) {
  const file = input.files?.[0]; if (!file) return;
  try { S.editingBenefit.iconBase64 = await compressImageFile(file, { maxDim: 256, maxBytes: 120 * 1024 }); }
  catch { toast('Não consegui processar essa imagem. Tente outra.'); return; }
  syncBenefitForm(); render();
}
function clearBenefitIcon() { S.editingBenefit.iconBase64 = ''; syncBenefitForm(); render(); }
async function benefitBanner(input) {

function syncBenefitForm() {
  const b = S.editingBenefit; if (!b) return;
  const g = id => document.getElementById(id);
  if (g('bf-name')) b.name = g('bf-name').value;
  if (g('bf-category')) b.category = g('bf-category').value;
  if (g('bf-order')) b.order = Number(g('bf-order').value || 0);
  if (g('bf-description')) b.description = g('bf-description').value;
  if (g('bf-details')) b.details = g('bf-details').value;
  if (g('bf-responsible')) b.responsible = g('bf-responsible').value;
  if (g('bf-icon')) b.icon = g('bf-icon').value;
  if (g('bf-startDate')) b.startDate = g('bf-startDate').value;
  if (g('bf-endDate')) b.endDate = g('bf-endDate').value;
  if (g('bf-active')) b.active = g('bf-active').checked;
  if (g('bf-featured')) b.featured = g('bf-featured').checked;

function collectLinks() {
  const b = S.editingBenefit;
  const rows = [...document.querySelectorAll('#bf-links .link-row')];
  const links = rows.map(r => ({
    label: r.querySelector('.lk-label').value.trim(),
    url: r.querySelector('.lk-url').value.trim()
  })).filter(l => l.url);
  b.links = links; b.documents = [];
}
async function saveBenefit() {
  syncBenefitForm();
  const b = S.editingBenefit;
  if (!b.name.trim()) { toast('Informe o nome do benefício.'); return; }
  // RH de filial: o benefício é sempre da filial e aparece só para ela.
  if (!isMatriz()) { b.ownerUnit = myUnit(); b.units = [myUnit()]; }
  try {
    const savedId = await DB.saveBenefit(b);
    await logAudit({ action: b.id ? 'update' : 'create', entity: 'benefit', entityId: savedId, userEmail: S.user.email, detail: b.name });
  } catch (e) { toast('Não consegui salvar: sem permissão ou sem conexão.'); return; }
  S.editingBenefit = null;
  S.benefits = await DB.listBenefits();
  toast('Benefício salvo.');
  render();
}
async function delBenefit(bid) {
  const b = S.benefits.find(x => x.id === bid);
  S.editingSlot = null;
  if (!b || !ownsBenefit(b)) return;
  if (!confirm(`Excluir o benefício “${b?.name}”? Esta ação não pode ser desfeita.`)) return;
  await DB.deleteBenefit(bid);
  await logAudit({ action: 'delete', entity: 'benefit', entityId: bid, userEmail: S.user.email, detail: b?.name });
  S.benefits = await DB.listBenefits();
  toast('Benefício excluído.');
  render();
}

async function saveRule() {
  const r = S.editingRule;
  r.sindicato = document.getElementById('rl-sindicato').value.trim();
  r.tipo = document.getElementById('rl-tipo').value.trim();
  r.profileId = document.getElementById('rl-profile').value;
  r.active = document.getElementById('rl-active').checked;
  r.unit = isMatriz() ? (document.getElementById('rl-unit')?.value || '') : myUnit();
  if (!r.sindicato) { toast('Informe o sindicato.'); return; }
  if (!r.profileId) { toast('Selecione o perfil de destino.'); return; }
  // Evita duplicidade exata (mesma filial + sindicato + tipo) — a última venceria em silêncio.
  const dup = S.rules.find(x => x.id !== r.id &&
    DB.sameUnit(x.unit, r.unit) &&
    x.sindicato.trim().toLowerCase() === r.sindicato.toLowerCase() &&
    (x.tipo || '').trim().toLowerCase() === r.tipo.toLowerCase());
  if (dup) { toast('Já existe uma regra para esse Sindicato + Tipo.'); return; }
  const rid = await DB.saveProfileRule(r);
  await logAudit({ action: r.id ? 'update' : 'create', entity: 'profile_rule', entityId: rid, userEmail: S.user.email, detail: `${r.sindicato} / ${r.tipo || 'qualquer'} → ${profileName(r.profileId)}` });
  S.editingRule = null;
  S.rules = await DB.listProfileRules();
  toast('Regra salva.'); render();
}
async function delRule(rid) {
  const r = S.rules.find(x => x.id === rid);
  if (!confirm(`Excluir a regra “${r?.sindicato} / ${r?.tipo || 'qualquer tipo'}”?`)) return;
  await DB.deleteProfileRule(rid);
  await logAudit({ action: 'delete', entity: 'profile_rule', entityId: rid, userEmail: S.user.email, detail: r?.sindicato });
  S.rules = await DB.listProfileRules();
  toast('Regra excluída.'); render();
}

// Normaliza cabeçalho de coluna (sem acento, minúsculo) p/ casar nomes.
function normHeader(h) {
  return String(h || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
}
async function importFile(input) {
  const file = input.files?.[0]; if (!file) return;
  if (typeof XLSX === 'undefined') { toast('Biblioteca de leitura não carregou. Recarregue a página.'); return; }
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(ws, { defval: '' });
    const map = { name: ['nome', 'funcionario', 'colaborador'], cpf: ['cpf'], profile: ['perfil'],
      sindicato: ['sindicato', 'convencao', 'convencao coletiva', 'cct'],
      tipo: ['tipo', 'tipo de contrato', 'vinculo', 'categoria'],
      unit: ['unidade', 'filial'], department: ['departamento', 'setor'], role: ['cargo', 'funcao'],
      situation: ['situacao'], admissionDate: ['data de admissao', 'admissao'], registry: ['matricula'] };
    const rows = raw.map(r => {
      const keys = Object.keys(r);
      const pick = (aliases) => {
        const k = keys.find(k => aliases.includes(normHeader(k)));
        return k ? r[k] : '';
      };
      const out = {};
      for (const field in map) out[field] = pick(map[field]);
      return out;
    }).filter(r => String(r.cpf).replace(/\D/g, '').length >= 8 && String(r.name).trim());
    if (!rows.length) { toast('Nenhuma linha válida encontrada (precisa de Nome e CPF).'); return; }
    S.importPreview = { stage: 'preview', rows, fileName: file.name, summary: null };
    render();
  } catch (e) {
    toast('Erro ao ler a planilha: ' + (e.message || e));
  }
}
async function confirmImport() {
  const p = S.importPreview;
  const btn = document.getElementById('imp-confirm');
  if (btn) { btn.disabled = true; btn.textContent = 'Importando…'; }
  const importId = 'imp_' + id();
  let summary;
  try {
    if (isMatriz()) S.admins = await DB.listAdmins(); // filiais com RH próprio atualizadas
    summary = await DB.importEmployees(p.rows, {
      importId, fileName: p.fileName, userEmail: S.user.email,
      scopeUnit: scopeUnit(),
      independentUnits: isMatriz() ? independentUnits() : []
    });
  } catch (e) {
    toast('A importação falhou: ' + (e.message || e));
    if (btn) { btn.disabled = false; btn.textContent = `Substituir base (${p.rows.length})`; }
    return;
  }
  await DB.saveImportRecord(summary);
  await logAudit({ action: 'import', entity: 'employees', entityId: importId, userEmail: S.user.email,
    detail: `${scopeLabel()}: ${summary.totalEmployees} na base, +${summary.totalAdded}/-${summary.totalRemoved}` });
  S.importPreview = { stage: 'done', summary };
  S.employees = await DB.listEmployees(scopeUnit());
  render();
}

// Compacta a imagem no navegador (reduz tamanho p/ não inchar o banco).
function compressImage(file, maxW = 1080, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
      URL.revokeObjectURL(img.src);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
async function commUpload(input) {
  const f = input.files?.[0]; if (!f) return;
  try {
    S.communication.imageBase64 = await compressImage(f);
    S.communication.id = 'cm_' + id(); // arte nova → reaparece uma vez
    render();
  } catch (e) { toast('Não consegui processar a imagem.'); }
}
function commRemove() {
  S.communication.imageBase64 = '';
  S.communication.active = false;
  render();

async function commSave() {
  const active = document.getElementById('cm-active')?.checked || false;
  const c = S.communication || {};
  const target = isMatriz() ? S.commTarget : myUnit();
  const data = {
    imageBase64: c.imageBase64 || '',
    active: !!(active && c.imageBase64),
    id: c.id || (c.imageBase64 ? 'cm_' + id() : '')
  };
  if (!target) data.units = Array.isArray(c.units) ? c.units : [];
  try {
    if (target) await DB.saveUnitCommunication(target, data);
    else await DB.saveCommunication(data);
  } catch (e) { toast('Não consegui salvar: sem permissão ou sem conexão.'); return; }
  await logAudit({ action: 'update', entity: 'communication', userEmail: S.user.email,
    detail: `${target || 'geral'} · ${data.active ? 'ativo' : 'inativo'}` });
  S.communication = (target ? await DB.getUnitCommunication(target) : await DB.getCommunication()) || data;
  toast(data.active ? 'Comunicado publicado!' : 'Comunicado salvo.');
  render();
}

      <div class="modal-head"><h2>Trocar filial</h2><button class="x" onclick="window.__closeAdmin()">×</button></div>
      <div class="modal-body">
        <p style="margin:0 0 14px"><b>${esc(a.email)}</b></p>
        ${unitField}
      </div>
      <div class="modal-foot"><button class="btn line" onclick="window.__closeAdmin()">Cancelar</button>
        <button class="btn" onclick="window.__saveAdmin()">Salvar</button></div></div></div>`;
  }
  const create = a.mode !== 'link';
  return `<div class="modal-bg"><div class="modal" style="width:min(520px,100%)">
    <div class="modal-head"><h2>Novo usuário</h2><button class="x" onclick="window.__closeAdmin()">×</button></div>
    <div class="modal-body">
      <div class="chips" style="margin-bottom:16px">
        <span class="chip ${create ? 'on' : ''}" onclick="window.__adminMode('create')">Criar login novo</span>
        <span class="chip ${!create ? 'on' : ''}" onclick="window.__adminMode('link')">Liberar login que já existe</span>
      </div>
      <label class="lbl">E-mail</label>
      <input class="field" id="ad-email" type="email" value="${escAttr(a.email || '')}" placeholder="rh.filial@raguife.com" style="margin-bottom:14px">
      ${create
        ? `<label class="lbl">Senha inicial (mínimo 6 caracteres)</label>
           <input class="field" id="ad-pass" type="text" autocomplete="new-password" style="margin-bottom:14px">`
        : `<label class="lbl">Código (UID) do login</label>
           <input class="field" id="ad-uid" placeholder="aparece na tela “Acesso não liberado” de quem tentou entrar" style="margin-bottom:14px">`}
      ${unitField}
      <p class="muted" style="font-size:12.5px;margin:0">${create
        ? 'Passe o e-mail e a senha para a pessoa. Ela pode trocar a senha depois pelo “Esqueci minha senha” do Firebase, se estiver ativo.'
        : 'Use quando a pessoa já tem login (criado antes ou pelo console do Firebase) e vê a tela “Acesso não liberado”.'}</p>
    </div>
    <div class="modal-foot"><button class="btn line" onclick="window.__closeAdmin()">Cancelar</button>
      <button class="btn" id="ad-save" onclick="window.__saveAdmin()">${create ? 'Criar usuário' : 'Liberar acesso'}</button></div></div></div>`;
}
async function saveAdmin() {
  const a = S.editingAdmin;
  const unit = document.getElementById('ad-unit').value;
  if (!a.isNew) {
    await DB.saveAdmin(a.id, { ...a, unit });
    await logAudit({ action: 'update', entity: 'admin', entityId: a.id, userEmail: S.user.email, detail: `${a.email} → ${unit || 'Matriz'}` });
    S.editingAdmin = null; S.admins = await DB.listAdmins();
    toast('Filial atualizada.'); render(); return;
  }
  const email = document.getElementById('ad-email').value.trim();
  if (!email) { toast('Informe o e-mail.'); return; }
  const btn = document.getElementById('ad-save');
  let uid = '';
  if (a.mode === 'link') {
    uid = (document.getElementById('ad-uid').value || '').trim();
    if (!uid) { toast('Informe o código (UID).'); return; }
  } else {
    const pass = document.getElementById('ad-pass').value;
    if (String(pass).length < 6) { toast('A senha precisa ter ao menos 6 caracteres.'); return; }
    if (btn) { btn.disabled = true; btn.textContent = 'Criando…'; }
    try {
      uid = (await createAuthUser(email, pass)).uid;
    } catch (e) {
      const c = String(e?.code || '');
      toast(c.includes('email-already-in-use')
        ? 'Esse e-mail já tem login. Use “Liberar login que já existe” com o código (UID) da pessoa.'
        : c.includes('invalid-email') ? 'E-mail inválido.'
        : 'Não consegui criar o login: ' + (e?.code || e?.message || e));
      if (btn) { btn.disabled = false; btn.textContent = 'Criar usuário'; }
      return;
    }
  }
  await DB.saveAdmin(uid, { email, unit, active: true, createdAt: Date.now(), createdBy: S.user.email });
  await logAudit({ action: 'create', entity: 'admin', entityId: uid, userEmail: S.user.email, detail: `${email} · ${unit || 'Matriz'}` });
  S.editingAdmin = null; S.admins = await DB.listAdmins();
  toast(a.mode === 'link' ? 'Acesso liberado.' : 'Usuário criado.'); render();
}
async function toggleAdmin(uid) {
  const a = S.admins.find(x => x.id === uid);
  if (!a || uid === S.user.uid) return;
  const turnOff = a.active !== false;
  if (turnOff && !confirm(`Desativar ${a.email}? A pessoa perde o acesso ao painel na hora.`)) return;
  await DB.saveAdmin(uid, { ...a, active: !turnOff });
  await logAudit({ action: turnOff ? 'disable' : 'enable', entity: 'admin', entityId: uid, userEmail: S.user.email, detail: a.email });
  S.admins = await DB.listAdmins();
  toast(turnOff ? 'Usuário desativado.' : 'Usuário reativado.'); render();
}

// Cada linha = uma data de atendimento em UMA filial. O funcionário só vê as
// datas da unidade dele, então a filial é obrigatória.
// ============================================================================
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function brDate(iso) {
  const p = String(iso || '').split('-');
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : '—';
}
function slotChip(x) {
  const sp = DB.specialtyOf(x.specialty);
  const hora = x.startTime ? (x.startTime + (x.endTime ? ' às ' + x.endTime : '')) : '';
  return `<button class="ag-chip ${x.active === false ? 'off' : ''}"
      style="border-left-color:${sp.color};background:${sp.color}14;color:${sp.color}"
      onclick="event.stopPropagation();window.__editSlot('${x.id}')"
      title="${escAttr(DB.slotLabel(x) + (x.professional ? ' — ' + x.professional : ''))}">
    <b>${sp.icon} ${esc(DB.slotLabel(x))}</b>
    ${hora ? `<span>⏱ ${esc(hora)}</span>` : ''}</button>`;
}
function medicalView() {
  const units = knownUnits();
  if (!S.medUnit && units.length) S.medUnit = units[0];
  if (!S.medMonth) S.medMonth = todayISO().slice(0, 7);
  const ym = S.medMonth;
  const mine = (S.medical || []).filter(x =>
    S.medUnit && DB.normKey(x.unit) === DB.normKey(S.medUnit) && x.date.slice(0, 7) === ym);
  const byDay = {};
  mine.forEach(x => { (byDay[x.date] = byDay[x.date] || []).push(x); });

  const [Y, M] = ym.split('-').map(Number);
  const firstWd = new Date(Y, M - 1, 1).getDay();
  const nDays = new Date(Y, M, 0).getDate();
  const hoje = todayISO();

  let cells = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'].map(w => `<div class="ag-wd">${w}</div>`).join('');
  for (let i = 0; i < firstWd; i++) cells += '<div class="ag-cell out"></div>';
  for (let d = 1; d <= nDays; d++) {
    const key = `${Y}-${String(M).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells += `<div class="ag-cell ${key === hoje ? 'today' : ''}" onclick="window.__newSlotOn('${key}')">
      <span class="ag-day">${d}</span><span class="ag-add">+</span>
      ${(byDay[key] || []).map(slotChip).join('')}</div>`;
  }
  const resto = (firstWd + nDays) % 7;
  if (resto) for (let i = resto; i < 7; i++) cells += '<div class="ag-cell out"></div>';

  const unitOpts = units.map(u =>
    `<option value="${escAttr(u)}" ${DB.normKey(u) === DB.normKey(S.medUnit) ? 'selected' : ''}>${esc(u)}</option>`).join('');

  return head('Atendimentos', 'Clique num dia para marcar um atendimento. O funcionário vê a agenda da filial dele.',
    `<button class="btn line ag-actions" onclick="window.print()">Imprimir</button>
     <button class="btn ag-actions" onclick="window.__editSlot('')">+ Nova data</button>`) + `
    <div class="hint">💡 O link de agendamento é <b>um só</b> para todas as datas e fica em
      <b>Configurações → Atendimentos médicos</b>. Aqui você define quando, onde e qual especialidade.</div>
    <div class="ag">
      <div class="ag-top">
        <div class="ag-title"><span class="ag-badge">🩺</span>
          <div><h3>Agenda Médica</h3>
            <span>${esc(monthLabelRH(ym))}${S.medUnit ? ' · ' + esc(S.medUnit) : ''}</span></div></div>
        <img class="ag-logo" src="${escAttr(LOGO)}" alt="Raguife">

async function saveSlot() {
  const g = i => document.getElementById(i);
  const isNew = !S.editingSlot.id;
  const common = {
    startTime: g('sl-start').value,
    endTime: g('sl-end').value,
    specialty: g('sl-spec').value,
    title: g('sl-title').value.trim(),
    professional: g('sl-prof').value.trim(),
    note: g('sl-note').value.trim(),
    active: g('sl-active').checked
  };
  if (common.startTime && common.endTime && common.endTime < common.startTime) {
    toast('O horário de fim é antes do início.'); return;
  }

  // --- Edição de um atendimento existente ---
  if (!isNew) {
    const data = { ...common, id: S.editingSlot.id, date: g('sl-date').value, unit: g('sl-unit').value };
    if (!data.date) { toast('Escolha a data.'); return; }
    if (!data.unit) { toast('Escolha a filial — sem ela ninguém vê esta data.'); return; }
    await DB.saveMedicalSlot(data);
    await logAudit({ action: 'update', entity: 'medical_slot',
      detail: `${brDate(data.date)} · ${data.unit} · ${DB.slotLabel(data)}`, userEmail: S.user.email });
    S.editingSlot = null; S.medMonth = data.date.slice(0, 7); S.medUnit = data.unit;
    S.medical = await DB.listMedicalSlots();
    render(); toast('Atendimento salvo.'); return;
  }

  // --- Criação em lote: filiais × datas ---
  const selUnits = [...document.querySelectorAll('.sl-unit:checked')].map(e => e.value);
  if (!selUnits.length) { toast('Marque ao menos uma filial.'); return; }
  const from = g('sl-from').value;
  const to = g('sl-to').value;
  if (!from) { toast('Escolha a data "De".'); return; }
  const wds = [...document.querySelectorAll('.sl-wd:checked')].map(e => Number(e.value));

  const dates = [];
  if (!to || to === from) {
    dates.push(from);
  } else {
    if (to < from) { toast('"Até" está antes de "De".'); return; }
    if (!wds.length) { toast('Com "Até" preenchido, marque os dias da semana que se repetem.'); return; }
    let d = new Date(from + 'T00:00:00');
    const end = new Date(to + 'T00:00:00');
    while (d <= end) {
      if (wds.includes(d.getDay())) {
        dates.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`);
      }
      d.setDate(d.getDate() + 1);
    }
    if (!dates.length) { toast('Nenhuma data no período com esses dias da semana.'); return; }
  }

  const jobs = [];
  for (const unit of selUnits) for (const date of dates) jobs.push(DB.saveMedicalSlot({ ...common, date, unit }));
  await Promise.all(jobs);
  await logAudit({ action: 'create', entity: 'medical_slot',
    detail: `${jobs.length} atendimento(s) · ${DB.slotLabel(common)}`, userEmail: S.user.email });
  S.editingSlot = null;
  S.medMonth = (dates[0] || from).slice(0, 7);
  S.medUnit = selUnits[0];
  S.medical = await DB.listMedicalSlots();
  render(); toast(`${jobs.length} atendimento(s) criado(s).`);
}
async function delSlot(sid) {
  const x = S.medical.find(y => y.id === sid);
  if (!confirm(`Excluir o atendimento de ${brDate(x?.date)} em ${x?.unit || '—'}?`)) return;
  await DB.deleteMedicalSlot(sid);
  await logAudit({ action: 'delete', entity: 'medical_slot',

  return head('Sugestões', sub) + `
    <div class="panel"><table>
      <thead><tr><th>Categoria</th><th>Funcionário</th><th>Sugestão</th><th>Status</th><th>Enviada em</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6"><div class="empty">Nenhuma sugestão ainda. Os funcionários enviam pela caixinha “Sugestões” no portal.</div></td></tr>'}</tbody>
    </table></div>`
    + (S.replyingSuggestion ? replySugModal() : '');
}

function replySugModal() {
  const s = (S.suggestions || []).find(x => x.id === S.replyingSuggestion);
  if (!s || s.anonymous) return '';
  const c = DB.suggestionCategoryOf(s.category);
  return `<div class="modal-bg"><div class="modal" style="width:min(560px,100%)">
    <div class="modal-head"><h2>Responder sugestão</h2>
      <button class="x" onclick="window.__closeSug()">×</button></div>
    <div class="modal-body">
      <div style="margin-bottom:16px;padding:12px 14px;border-radius:12px;background:${c.color}12;border:1px solid ${c.color}33">
        <div style="font-weight:800;color:${c.color}">${c.icon} ${esc(c.name)}</div>
        <div style="margin-top:4px"><b>${esc(s.employeeName || '—')}</b>${s.unit ? ' · ' + esc(s.unit) : ''}</div>
        <div class="muted" style="margin-top:6px;font-size:13px;white-space:pre-wrap">${esc(s.text)}</div>
      </div>
      <label class="lbl">Resposta ao funcionário</label>
      <textarea class="field" id="sug-reply" style="min-height:120px" placeholder="Escreva a resposta. Ela aparece para a pessoa em “Minhas sugestões”, no portal.">${esc(s.reply || '')}</textarea>
      <p class="muted" style="font-size:12.5px;margin:12px 0 0">O funcionário vê a resposta ao abrir o portal — não é enviado e-mail.</p>
    </div>
    <div class="modal-foot">
      <button class="btn line" onclick="window.__closeSug()">Cancelar</button>
      <button class="btn" onclick="window.__saveSug()">Enviar resposta</button>
    </div></div></div>`;
}
function replySug(sid) { S.replyingSuggestion = sid; render(); }
async function saveSug() {
  const reply = (document.getElementById('sug-reply').value || '').trim();
  if (!reply) { toast('Escreva a resposta.'); return; }
  const s = (S.suggestions || []).find(x => x.id === S.replyingSuggestion);
  await DB.replySuggestion(S.replyingSuggestion, reply, S.user.email);
  await logAudit({ action: 'reply', entity: 'suggestion', entityId: S.replyingSuggestion,
    detail: `${s?.employeeName || ''} · ${DB.suggestionCategoryOf(s?.category).name}`,
    userEmail: S.user.email });
  S.replyingSuggestion = null;
  S.suggestions = await DB.listSuggestions(scopeUnit());
  render(); toast('Resposta enviada.');
}
async function delSug(sid) {
  const s = (S.suggestions || []).find(x => x.id === sid);
  const who = s?.anonymous ? 'anônima' : (s?.employeeName || 'funcionário');
  if (!confirm(`Excluir a sugestão ${who === 'anônima' ? 'anônima' : 'de ' + who}? Isso não pode ser desfeito.`)) return;
  await DB.deleteSuggestion(sid);
  await logAudit({ action: 'delete', entity: 'suggestion', entityId: sid,
    detail: who, userEmail: S.user.email });
  S.suggestions = await DB.listSuggestions(scopeUnit());
  render(); toast('Sugestão excluída.');
}

// ============================================================================
// AUDITORIA (só matriz)
// ============================================================================
function auditView() {
  const rows = S.audit.map(a => `<tr>
    <td class="muted">${esc(dt(a.createdAt))}</td>
    <td><span class="tag ${a.action === 'delete' ? 'off' : 'on'}">${esc(a.action)}</span></td>
    <td>${esc(a.entity)}</td>
    <td class="muted">${esc(a.detail || '')}</td>
    <td class="muted" style="font-size:12px">${esc(a.userEmail || '')}${a.unit ? `<br>${esc(a.unit)}` : ''}</td>
  </tr>`).join('');
  return head('Auditoria', 'Registro das ações administrativas (últimas 100).') + `
    <div class="panel"><table>
      <thead><tr><th>Data/hora</th><th>Ação</th><th>Entidade</th><th>Detalhe</th><th>Usuário</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5"><div class="empty">Sem registros ainda.</div></td></tr>'}</tbody></table></div>`;
}

// ============================================================================
// Após render: carrega settings na primeira vez
// ============================================================================
async function postRender() {
  if (S.user && !S.settings) { S.settings = await DB.getSettings(); }
}

// --- Handlers globais (onclick inline) --------------------------------------
// ============================================================================
// Busca nas listas (atualiza só o corpo da tabela, sem perder o foco)
// ============================================================================
function empSearchSet(v) {
  S.empSearch = v;
  const el = document.getElementById('emp-tbody');
  if (el) el.innerHTML = employeeRows();
}
function benSearchSet(v) {
  S.benSearch = v;
  const el = document.getElementById('ben-tbody');
  if (el) el.innerHTML = benefitRows();
}

// ============================================================================
// Exportação para Excel (usa o SheetJS já carregado na página)
// ============================================================================
function downloadSheet(rows, sheetName, fileName) {
  if (typeof XLSX === 'undefined') { toast('Biblioteca de exportação não carregou. Recarregue a página.'); return; }
  if (!rows.length) { toast('Nada para exportar.'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, fileName);
}
function exportEmployees() {
  const rows = S.employees.map(e => ({
    Nome: e.name || '',
    CPF: e.cpfMasked || '',
    Perfil: (e.profileIds || []).map(profileName).join(', ') || e.profileRaw || '',
    Unidade: e.unit || '',
    Departamento: e.department || '',
    Cargo: e.role || ''
  }));
  downloadSheet(rows, 'Funcionários', isMatriz() ? 'funcionarios_raguife.xlsx' : `funcionarios_${DB.unitSlug(myUnit())}.xlsx`);
  logAudit({ action: 'export', entity: 'employees', userEmail: S.user.email, detail: `${rows.length} registros` });
}
function exportWinners(rid) {
  const r = S.viewingRaffle;
  const winners = (r && r._winners) || [];
  const rows = winners.map(w => ({
    Filme: w.filmTitle || '',
    Ganhador: w.employeeName || '',
    Voucher: w.voucherCode || ''
  }));
  downloadSheet(rows, 'Ganhadores', `ganhadores_${(r?.title || 'sorteio').replace(/\s+/g, '_').toLowerCase()}.xlsx`);
  logAudit({ action: 'export', entity: 'raffle_winners', entityId: rid, userEmail: S.user.email, detail: `${rows.length} ganhadores` });
}
