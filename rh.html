<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raguife · RH / DP</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ===========================================================================
   base.css — design tokens compartilhados (Funcionário + RH)
   Identidade Raguife: verde profundo + acento oliva, tipografia Bricolage/Inter.
   =========================================================================== */
:root{
  --bg:#eef5ec; --surface:#fff; --ink:#14241a; --muted:#647267; --line:#dce7db;
  --primary:#024f2b; --primary2:#0a6b3c; --soft:#e4f1e8;
  --accent:#739630; --accentSoft:#eef4e1;
  --bad:#c23a45; --badSoft:#fbeaeb; --warn:#b06b00; --warnSoft:#fff3d8;
  --ok:#1f7a4d; --okSoft:#e4f1e8;
  --shadow:0 12px 34px rgba(2,79,43,.10);
  --radius:16px;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}

/* Toast — usado nas duas áreas */
.toast{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);
  background:#14241a;color:#fff;border-radius:999px;padding:11px 15px;
  font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:60;
  box-shadow:0 10px 30px rgba(0,0,0,.25)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* ===========================================================================
   rh.css — Área RH/DP (desktop-first), redesign.
   Identidade Raguife: verde-floresta + acento oliva, tipografia Bricolage/Inter.
   Tom: calmo, organizado, profissional. Tokens base em base.css.
   =========================================================================== */
:root{
  --rh-canvas:#f3f7f0; --rh-paper:#ffffff; --rh-ink:#16241b; --rh-muted:#67746b;
  --rh-line:#e3ebdf; --rh-line2:#eef3ea; --rh-forest:#024f2b; --rh-pine:#022e1a;
  --rh-olive:#7aa42b; --rh-olive-soft:#eef4e1;
}
body{background:var(--rh-canvas);color:var(--rh-ink)}

/* eyebrow: rótulo curtinho que situa a seção */
.eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--rh-olive)}

/* ---------- Login ---------- */
.rh-login{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(120% 90% at 50% -10%, #e9f2e4, var(--rh-canvas))}
.rh-login-card{background:var(--rh-paper);border:1px solid var(--rh-line);border-radius:24px;
  box-shadow:0 1px 2px rgba(20,40,26,.04),0 24px 60px rgba(2,79,43,.10);
  padding:38px 34px;width:min(400px,100%);text-align:center;border-top:3px solid var(--rh-forest)}
.rh-login-card img{width:148px;margin:0 auto 20px;display:block}
.rh-login-card h1{font-family:var(--display);color:var(--rh-ink);font-size:25px;margin:0 0 6px;letter-spacing:-.01em}
.rh-login-card p{color:var(--rh-muted);font-size:14px;margin:0 0 22px;line-height:1.5}
.rh-login-card .field{margin-bottom:11px;text-align:left}

/* ---------- Shell ---------- */
.rh-shell{display:grid;grid-template-columns:258px 1fr;min-height:100vh}

/* Sidebar */
.rh-side{background:linear-gradient(180deg,var(--rh-forest),var(--rh-pine));color:#fff;
  padding:20px 14px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.rh-side .logo{padding:4px 8px 6px;margin-bottom:10px}
.rh-side .logo img{width:112px;display:block}
.rh-side nav{display:flex;flex-direction:column;gap:14px;flex:1;overflow:auto;padding-top:6px}
.rh-side nav::-webkit-scrollbar{width:0}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-eyebrow{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.13em;
  color:rgba(255,255,255,.42);padding:2px 12px 6px}
.rh-side nav button{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:transparent;border:0;color:rgba(255,255,255,.82);font:inherit;font-weight:600;
  font-size:14px;padding:9px 12px;border-radius:11px;cursor:pointer;transition:background .15s,color .15s}
.rh-side nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.rh-side nav button.active{background:rgba(255,255,255,.11);color:#fff}
.rh-side nav button.active::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;
  border-radius:0 3px 3px 0;background:var(--rh-olive)}
.rh-side nav button .ic{width:20px;height:20px;display:grid;place-items:center;color:rgba(255,255,255,.7);flex:none}
.rh-side nav button.active .ic,.rh-side nav button:hover .ic{color:#fff}
.rh-side nav button .ic svg{width:19px;height:19px}

.rh-side .who{border-top:1px solid rgba(255,255,255,.14);padding-top:12px;margin-top:8px}
.who-id{display:flex;align-items:center;gap:10px;padding:0 6px 10px}
.who-av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.who-tx{min-width:0}
.who-tx b{display:block;font-size:12.5px;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-tx span{font-size:11px;color:rgba(255,255,255,.6)}
.rh-side .who button{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  color:#fff;border-radius:10px;padding:9px;font-weight:800;font-size:12.5px;cursor:pointer;transition:background .15s}
.rh-side .who button:hover{background:rgba(255,255,255,.18)}

/* Conteúdo */
.rh-main{padding:32px 36px 48px;max-width:1180px}
.rh-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.rh-head h1{font-family:var(--display);font-size:29px;color:var(--rh-ink);margin:5px 0 0;letter-spacing:-.02em;line-height:1.1}
.rh-head p{color:var(--rh-muted);margin:6px 0 0;font-size:14.5px;max-width:62ch}

/* ---------- Form & botões ---------- */
.field{width:100%;border:1px solid var(--rh-line);background:#fff;border-radius:11px;
  padding:11px 13px;font:inherit;color:var(--rh-ink);outline:none;transition:border .15s,box-shadow .15s}
.field:focus{border-color:var(--rh-forest);box-shadow:0 0 0 3px rgba(2,79,43,.12)}
label.lbl,.lbl{display:block;font-size:11.5px;font-weight:800;color:var(--rh-muted);margin:0 0 6px;
  text-transform:uppercase;letter-spacing:.05em}
.btn{border:0;background:var(--rh-forest);color:#fff;border-radius:11px;padding:10px 18px;
  font:inherit;font-weight:800;cursor:pointer;transition:background .15s,transform .05s;line-height:1.2}
.btn:hover{background:#0a6b3c}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:default}
.btn.secondary{background:var(--rh-olive-soft);color:var(--rh-forest)}
.btn.line{background:#fff;color:var(--rh-forest);border:1px solid var(--rh-line)}
.btn.line:hover{background:#f6faf2;border-color:#cfded0}
.btn.danger{background:var(--badSoft);color:var(--bad)}
.btn.danger:hover{background:#f7dcde}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.error{display:none;background:var(--badSoft);color:var(--bad);border-radius:11px;padding:11px 13px;
  margin-top:12px;font-size:13px;font-weight:700;text-align:left}

/* ---------- KPIs ---------- */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:24px}
.kpi{background:var(--rh-paper);border:1px solid var(--rh-line);border-radius:16px;padding:18px 20px;position:relative}
.kpi b{display:block;font-family:var(--display);font-size:34px;color:var(--rh-forest);line-height:1;letter-spacing:-.02em}
.kpi span{display:block;margin-top:7px;font-size:13px;color:var(--rh-muted);font-weight:600}

/* ---------- Painéis ---------- */
.panel{background:var(--rh-paper);border:1px solid var(--rh-line);border-radius:16px;overflow:hidden;
  margin-bottom:22px;box-shadow:0 1px 2px rgba(20,40,26,.03),0 12px 30px rgba(20,40,26,.035)}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;
  border-bottom:1px solid var(--rh-line2);gap:12px;flex-wrap:wrap}
.panel-head h2{font-family:var(--display);font-size:17px;margin:0;color:var(--rh-ink);letter-spacing:-.01em}
.panel-body{padding:20px}

/* ---------- Tabelas ---------- */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--rh-muted);
  padding:12px 18px;border-bottom:1px solid var(--rh-line);font-weight:800;background:#fbfcf9}
td{padding:13px 18px;border-bottom:1px solid var(--rh-line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr:hover td{background:#f7faf4}
.muted{color:var(--rh-muted)}
.empty{padding:40px 24px;text-align:center;color:var(--rh-muted);font-size:14px}
.row-actions{display:flex;gap:6px;justify-content:flex-end}

/* tags / status */
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:11px;
  font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.tag.on{background:var(--okSoft);color:var(--ok)}
.tag.off{background:#eef0ec;color:#7c857d}
.tag.warn{background:var(--warnSoft);color:var(--warn)}
.tag.draft{background:#eef0ec;color:#7c857d}
.tag.open{background:var(--okSoft);color:var(--ok)}
.tag.closed{background:var(--warnSoft);color:var(--warn)}
.tag.drawn{background:#e6eefb;color:#2c5ca8}
.tag.published{background:var(--rh-olive-soft);color:var(--rh-forest)}

/* ---------- Form grid / chips ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.form-grid .full{grid-column:1/-1}
.form-grid textarea.field{min-height:84px;resize:vertical;font-family:var(--body);line-height:1.5}
.check{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:var(--rh-ink)}
.check input{width:17px;height:17px;accent-color:var(--rh-forest)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rh-line);border-radius:999px;
  padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;user-select:none;transition:.12s;color:var(--rh-ink)}
.chip:hover{border-color:#cfded0}
.chip.on{background:var(--rh-forest);color:#fff;border-color:var(--rh-forest)}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(8,20,12,.5);display:grid;place-items:center;padding:20px;z-index:50;
  backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:20px;width:min(720px,100%);max-height:90vh;overflow:auto;
  box-shadow:0 30px 80px rgba(0,0,0,.34)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;
  border-bottom:1px solid var(--rh-line2);position:sticky;top:0;background:#fff;z-index:2}
.modal-head h2{font-family:var(--display);font-size:20px;margin:0;letter-spacing:-.01em}
.modal-head button.x{background:transparent;border:0;font-size:24px;cursor:pointer;color:var(--rh-muted);line-height:1}
.modal-body{padding:22px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--rh-line2);
  position:sticky;bottom:0;background:#fff}

.icon-box{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;overflow:hidden;color:#fff;font-size:26px}
.icon-box.contain{padding:5px;background:#fff!important;border:1px solid var(--rh-line)}
.icon-box.contain img{max-width:100%;max-height:100%;object-fit:contain}
.icon-box.cover img{width:100%;height:100%;object-fit:cover}

.hint{font-size:13px;color:var(--rh-ink);background:var(--rh-olive-soft);border:1px solid #e2ebcf;
  border-radius:12px;padding:12px 14px;margin-bottom:16px;line-height:1.55}
.dropzone{display:block;width:100%;border:2px dashed var(--rh-line);border-radius:14px;padding:30px 20px;
  text-align:center;color:var(--rh-muted);cursor:pointer;line-height:1.6;transition:.15s}
.dropzone:hover{border-color:var(--rh-forest);background:#f7faf4;color:var(--rh-ink)}

/* link/film rows dentro de modais */
.link-row,.film-row{display:flex;gap:8px;margin-bottom:8px}

/* ---------- Responsivo: vira topo no celular ---------- */
@media (max-width:900px){
  .rh-shell{grid-template-columns:1fr}
  .rh-side{position:sticky;top:0;height:auto;flex-direction:column;padding:12px 12px 8px;z-index:20}
  .rh-side .logo{padding:2px 4px}
  .rh-side .logo img{width:96px}
  .rh-side nav{flex-direction:row;gap:8px;overflow-x:auto;padding:8px 2px}
  .nav-group{flex-direction:row;gap:6px}
  .nav-eyebrow{display:none}
  .rh-side nav button{width:auto;white-space:nowrap;padding:8px 12px}
  .rh-side nav button.active::before{display:none}
  .rh-side nav button.active{background:rgba(255,255,255,.16)}
  .rh-side .who{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:0;padding-top:8px;margin-top:0}
  .who-id{padding:0}
  .rh-side .who button{width:auto;padding:8px 14px}
  .rh-main{padding:22px 16px 40px}
  .form-grid{grid-template-columns:1fr}
  .rh-head h1{font-size:24px}
}


/* === Agenda Médica — calendário de cadastro (baseado no protótipo) === */
.ag{background:#fff;border:1px solid var(--rh-line);border-radius:14px;overflow:hidden;margin-bottom:18px}
.ag-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--rh-line)}
.ag-title{display:flex;align-items:center;gap:12px;margin-right:auto}
.ag-badge{width:44px;height:44px;border-radius:50%;border:2px solid var(--rh-olive);display:grid;place-items:center;font-size:21px;flex:none}
.ag-title h3{margin:0;font-family:var(--display);font-size:20px;line-height:1.05;color:var(--rh-forest);text-transform:uppercase;letter-spacing:.01em}
.ag-title span{display:block;font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--rh-muted);text-transform:uppercase;margin-top:3px}
.ag-nav{display:flex;align-items:center;gap:8px}
.ag-nav b{min-width:150px;text-align:center;font-family:var(--display);font-size:16px;color:var(--rh-forest)}
.ag-nav button{border:1px solid var(--rh-line);background:#fff;color:var(--rh-forest);width:32px;height:32px;border-radius:9px;font-weight:900;font-size:16px;cursor:pointer}
.ag-nav button:hover{background:var(--rh-canvas)}
.ag-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.ag-wd{background:var(--rh-forest);color:#fff;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;text-align:center;padding:9px 0}
.ag-cell{min-height:116px;border-right:1px solid var(--rh-line);border-bottom:1px solid var(--rh-line);padding:6px 6px 8px;position:relative;background:#fff;cursor:pointer;text-align:left}
.ag-cell:nth-child(7n){border-right:0}
.ag-cell.out{background:#fafbfa;cursor:default}
.ag-cell:not(.out):hover{background:#f4f8f3}
.ag-day{font-size:12.5px;font-weight:800;color:var(--rh-ink)}
.ag-cell.today .ag-day{background:var(--rh-forest);color:#fff;border-radius:6px;padding:1px 6px}
.ag-add{position:absolute;right:6px;top:5px;opacity:0;font-size:16px;line-height:1;color:var(--rh-forest);font-weight:900;transition:.15s}
.ag-cell:not(.out):hover .ag-add{opacity:.7}
.ag-chip{display:block;width:100%;text-align:left;border:0;border-left:3px solid;border-radius:5px;padding:4px 6px;margin-top:4px;font:inherit;cursor:pointer}
.ag-chip b{display:block;font-size:10.5px;font-weight:800;line-height:1.25}
.ag-chip span{display:block;font-size:9.5px;opacity:.8;margin-top:1px}
.ag-chip.off{opacity:.42}
.ag-legend{display:flex;flex-wrap:wrap;gap:12px 22px;padding:15px 20px;border-top:1px solid var(--rh-line);background:#fff}
.ag-legend .lbl{width:100%;margin:0 0 2px}
.ag-leg{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--rh-ink)}
.ag-dot{width:11px;height:11px;border-radius:50%;flex:none}
.ag-empty{padding:14px 20px;font-size:13px;color:var(--rh-muted);border-top:1px solid var(--rh-line)}

.ag-logo,.ag-foot{display:none}
@media print{
  .rh-side,.rh-head,.ag-actions,.ag-add,.hint,.modal-bg,.ag-nav button{display:none!important}
  .ag-logo{display:block;height:34px;width:auto;margin-left:auto}
  .ag-foot{display:block;text-align:center;padding:13px;font-size:9.5px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--rh-muted);border-top:1px solid var(--rh-line)}
  .ag-nav b{min-width:0}
  .rh-main{padding:0!important;margin:0!important}
  .rh-shell{display:block!important}
  .ag{border:0;margin:0}
  .ag-cell{min-height:96px}
  @page{size:A4 landscape;margin:8mm}
}
</style></head><body>
<div id="root"><div class="rh-login"><div class="rh-login-card"><h1>Carregando…</h1></div></div></div>

<script type="module">
// ============================================================================
// rh.js — Área RH/DP (desktop-first).

// tinham divergido. Uma única fonte de verdade evita que isso volte a acontecer.

import { LOGO, LOGO_WHITE } from './brand.js';

const root = () => document.getElementById('root');

// --- Estado ------------------------------------------------------------------

  medical: [], editingSlot: null, medMonth: '', medUnit: '',
  requests: [], confirmingRequest: null
};

// Ícones de linha (SVG) — substituem os emojis, dão um ar profissional.
const ICONS = {

onAuthStateChanged(auth, async (user) => {
  S.user = user;
  if (user) {
    try { await loadAll(); render(); }
    catch (e) {
      root().innerHTML = `<div class="rh-login"><div class="rh-login-card">

        <p style="font-size:11px;color:var(--muted);margin-top:10px">Detalhe técnico: ${esc(e?.message || e)}</p>
      </div></div>`;

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    await DB.logAudit({ action: 'login', entity: 'auth', userEmail: email });
  } catch (e) {
    err.style.display = 'block';
    err.textContent = authError(e);
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}
function authError(e) {
  const c = String(e?.code || '');
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found'))
    return 'E-mail ou senha incorretos.';
  if (c.includes('too-many-requests')) return 'Muitas tentativas. Aguarde alguns minutos.';
  if (c.includes('network')) return 'Sem conexão. Verifique sua internet.';
  return 'Não foi possível entrar. Detalhe: ' + (e?.code || e?.message || e);
}
async function doLogout() { await signOut(auth); }

async function loadAll() {
  S.settings = await DB.getSettings();
  S.profiles = await DB.seedProfilesIfEmpty();
  S.benefits = await DB.listBenefits();
  S.raffles = await DB.listRaffles();
  S.communication = await DB.getCommunication() || { imageBase64: '', active: false, id: '' };
}
async function refreshTabData() {
  if (S.tab === 'employees') S.employees = await DB.listEmployees();
  if (S.tab === 'imports') S.imports = await DB.listImports();
  if (S.tab === 'audit') S.audit = await DB.listAudit();
  if (S.tab === 'profiles') S.profiles = await DB.listProfiles();
  if (S.tab === 'rules') { S.rules = await DB.listProfileRules(); S.profiles = await DB.listProfiles(); }
  if (S.tab === 'benefits') { S.benefits = await DB.listBenefits(); S.employees = await DB.listEmployees(); }
  if (S.tab === 'raffles') S.raffles = await DB.listRaffles();
  if (S.tab === 'medical') { S.medical = await DB.listMedicalSlots(); S.employees = await DB.listEmployees(); }

// Mutações no benefício em edição
function benefitColor(i) { syncBenefitForm(); S.editingBenefit.color = i; render(); }
function benefitProfile(pid) {
  const arr = S.editingBenefit.profileIds || [];
  S.editingBenefit.profileIds = arr.includes(pid) ? arr.filter(x => x !== pid) : [...arr, pid];
  syncBenefitForm(); render();
}
// Filiais distintas encontradas na base de funcionários (fonte do seletor).
// Vem da própria base para não haver erro de digitação que quebre o filtro.
function knownUnits() {
  const seen = new Map(); // normalizado -> rótulo original (o 1º que aparecer)
  for (const e of (S.employees || [])) {
    const u = String(e.unit || '').trim();
    if (!u) continue;
    const k = DB.normKey(u);
    if (!seen.has(k)) seen.set(k, u);
  }
  return [...seen.values()].sort((a, b) => a.localeCompare(b));
}
function benefitUnit(i) {
  const units = knownUnits();
  const u = units[i]; if (u == null) return;
  const arr = S.editingBenefit.units || [];
  const on = arr.some(x => DB.normKey(x) === DB.normKey(u));
  S.editingBenefit.units = on ? arr.filter(x => DB.normKey(x) !== DB.normKey(u)) : [...arr, u];
  syncBenefitForm(); render();
}
async function benefitIcon(input) {
  const file = input.files?.[0]; if (!file) return;
  S.editingBenefit.iconBase64 = await readFileDataURL(file);
  syncBenefitForm(); render();
}
function clearBenefitIcon() { S.editingBenefit.iconBase64 = ''; syncBenefitForm(); render(); }

function syncBenefitForm() {
  const b = S.editingBenefit; if (!b) return;
  const g = id => document.getElementById(id);
  if (g('bf-name')) b.name = g('bf-name').value;
  if (g('bf-category')) b.category = g('bf-category').value;
  if (g('bf-order')) b.order = Number(g('bf-order').value || 0);
  if (g('bf-description')) b.description = g('bf-description').value;
  if (g('bf-details')) b.details = g('bf-details').value;
  if (g('bf-responsible')) b.responsible = g('bf-responsible').value;
  if (g('bf-icon')) b.icon = g('bf-icon').value;
  if (g('bf-startDate')) b.startDate = g('bf-startDate').value;
  if (g('bf-endDate')) b.endDate = g('bf-endDate').value;
  if (g('bf-active')) b.active = g('bf-active').checked;
  if (g('bf-featured')) b.featured = g('bf-featured').checked;
  if (g('bf-isNew')) b.isNew = g('bf-isNew').checked;
  if (g('bf-actionRequired')) b.actionRequired = g('bf-actionRequired').checked;
  const fit = document.querySelector('input[name="bf-fit"]:checked');
  if (fit) b.iconFit = fit.value;
  collectLinks();

function collectLinks() {
  const b = S.editingBenefit;
  const rows = [...document.querySelectorAll('#bf-links .link-row')];
  const links = rows.map(r => ({
    label: r.querySelector('.lk-label').value.trim(),
    url: r.querySelector('.lk-url').value.trim()
  })).filter(l => l.url);
  b.links = links; b.documents = [];
}

async function saveRule() {
  const r = S.editingRule;
  r.sindicato = document.getElementById('rl-sindicato').value.trim();
  r.tipo = document.getElementById('rl-tipo').value.trim();
  r.profileId = document.getElementById('rl-profile').value;
  r.active = document.getElementById('rl-active').checked;
  if (!r.sindicato) { toast('Informe o sindicato.'); return; }
  if (!r.profileId) { toast('Selecione o perfil de destino.'); return; }
  // Evita duplicidade exata (mesmo sindicato + tipo) — a última venceria em silêncio.
  const dup = S.rules.find(x => x.id !== r.id &&
    DB.matchRule && x.sindicato.trim().toLowerCase() === r.sindicato.toLowerCase() &&
    (x.tipo || '').trim().toLowerCase() === r.tipo.toLowerCase());
  if (dup) { toast('Já existe uma regra para esse Sindicato + Tipo.'); return; }
  const rid = await DB.saveProfileRule(r);
  await DB.logAudit({ action: r.id ? 'update' : 'create', entity: 'profile_rule', entityId: rid, userEmail: S.user.email, detail: `${r.sindicato} / ${r.tipo || 'qualquer'} → ${profileName(r.profileId)}` });
  S.editingRule = null;
  S.rules = await DB.listProfileRules();
  toast('Regra salva.'); render();
}
async function delRule(rid) {
  const r = S.rules.find(x => x.id === rid);
  if (!confirm(`Excluir a regra “${r?.sindicato} / ${r?.tipo || 'qualquer tipo'}”?`)) return;
  await DB.deleteProfileRule(rid);
  await DB.logAudit({ action: 'delete', entity: 'profile_rule', entityId: rid, userEmail: S.user.email, detail: r?.sindicato });
  S.rules = await DB.listProfileRules();
  toast('Regra excluída.'); render();
}

// Normaliza cabeçalho de coluna (sem acento, minúsculo) p/ casar nomes.
function normHeader(h) {
  return String(h || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}
async function importFile(input) {
  const file = input.files?.[0]; if (!file) return;
  if (typeof XLSX === 'undefined') { toast('Biblioteca de leitura não carregou. Recarregue a página.'); return; }
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(ws, { defval: '' });
    const map = { name: ['nome', 'funcionario', 'colaborador'], cpf: ['cpf'], profile: ['perfil'],
      sindicato: ['sindicato', 'convencao', 'convencao coletiva', 'cct'],
      tipo: ['tipo', 'tipo de contrato', 'vinculo', 'categoria'],
      unit: ['unidade', 'filial'], department: ['departamento', 'setor'], role: ['cargo', 'funcao'],
      situation: ['situacao'], admissionDate: ['data de admissao', 'admissao'], registry: ['matricula'] };
    const rows = raw.map(r => {
      const keys = Object.keys(r);
      const pick = (aliases) => {
        const k = keys.find(k => aliases.includes(normHeader(k)));
        return k ? r[k] : '';
      };
      const out = {};
      for (const field in map) out[field] = pick(map[field]);
      return out;
    }).filter(r => String(r.cpf).replace(/\D/g, '').length >= 8 && String(r.name).trim());
    if (!rows.length) { toast('Nenhuma linha válida encontrada (precisa de Nome e CPF).'); return; }
    S.importPreview = { stage: 'preview', rows, fileName: file.name, summary: null };
    render();
  } catch (e) {
    toast('Erro ao ler a planilha: ' + (e.message || e));
  }
}
async function confirmImport() {
  const p = S.importPreview;
  const btn = document.getElementById('imp-confirm');
  if (btn) { btn.disabled = true; btn.textContent = 'Importando…'; }
  const importId = 'imp_' + id();
  const summary = await DB.importEmployees(p.rows, { importId, fileName: p.fileName, userEmail: S.user.email });

// Compacta a imagem no navegador (reduz tamanho p/ não inchar o banco).
function compressImage(file, maxW = 1080, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
      URL.revokeObjectURL(img.src);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
async function commUpload(input) {
  const f = input.files?.[0]; if (!f) return;
  try {
    S.communication.imageBase64 = await compressImage(f);
    S.communication.id = 'cm_' + id(); // arte nova → reaparece uma vez
    render();
  } catch (e) { toast('Não consegui processar a imagem.'); }
}
function commRemove() {
  S.communication.imageBase64 = '';
  S.communication.active = false;
  render();
}
async function commSave() {
  const active = document.getElementById('cm-active')?.checked || false;
  const c = S.communication || {};
  const data = {
    imageBase64: c.imageBase64 || '',
    active: !!(active && c.imageBase64),
    id: c.id || (c.imageBase64 ? 'cm_' + id() : '')
  };
  await DB.saveCommunication(data);
  await DB.logAudit({ action: 'update', entity: 'communication', userEmail: S.user.email, detail: data.active ? 'ativo' : 'inativo' });
  S.communication = await DB.getCommunication() || data;
  toast(data.active ? 'Comunicado publicado!' : 'Comunicado salvo.');
  render();
}

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function brDate(iso) {
  const p = String(iso || '').split('-');
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : '—';
}
function slotChip(x) {
  const sp = DB.specialtyOf(x.specialty);
  const hora = x.startTime ? (x.startTime + (x.endTime ? ' às ' + x.endTime : '')) : '';
  return `<button class="ag-chip ${x.active === false ? 'off' : ''}"
      style="border-left-color:${sp.color};background:${sp.color}14;color:${sp.color}"
      onclick="event.stopPropagation();window.__editSlot('${x.id}')"
      title="${escAttr(DB.slotLabel(x) + (x.professional ? ' — ' + x.professional : ''))}">
    <b>${sp.icon} ${esc(DB.slotLabel(x))}</b>
    ${hora ? `<span>⏱ ${esc(hora)}</span>` : ''}</button>`;
}
function medicalView() {
  const units = knownUnits();

  if (!S.medMonth) S.medMonth = todayISO().slice(0, 7);

  const mine = (S.medical || []).filter(x =>
    S.medUnit && DB.normKey(x.unit) === DB.normKey(S.medUnit) && x.date.slice(0, 7) === ym);
  const byDay = {};
  mine.forEach(x => { (byDay[x.date] = byDay[x.date] || []).push(x); });

  const [Y, M] = ym.split('-').map(Number);
  const firstWd = new Date(Y, M - 1, 1).getDay();
  const nDays = new Date(Y, M, 0).getDate();
  const hoje = todayISO();

  let cells = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'].map(w => `<div class="ag-wd">${w}</div>`).join('');
  for (let i = 0; i < firstWd; i++) cells += '<div class="ag-cell out"></div>';
  for (let d = 1; d <= nDays; d++) {
    const key = `${Y}-${String(M).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells += `<div class="ag-cell ${key === hoje ? 'today' : ''}" onclick="window.__newSlotOn('${key}')">
      <span class="ag-day">${d}</span><span class="ag-add">+</span>
      ${(byDay[key] || []).map(slotChip).join('')}</div>`;
  }
  const resto = (firstWd + nDays) % 7;
  if (resto) for (let i = resto; i < 7; i++) cells += '<div class="ag-cell out"></div>';

  const unitOpts = units.map(u =>
    `<option value="${escAttr(u)}" ${DB.normKey(u) === DB.normKey(S.medUnit) ? 'selected' : ''}>${esc(u)}</option>`).join('');

  return head('Atendimentos', 'Clique num dia para marcar um atendimento. O funcionário vê a agenda da filial dele.',
    `<button class="btn line ag-actions" onclick="window.print()">Imprimir</button>
     <button class="btn ag-actions" onclick="window.__editSlot('')">+ Nova data</button>`) + `
    <div class="hint">💡 O link de agendamento é <b>um só</b> para todas as datas e fica em
      <b>Configurações → Atendimentos médicos</b>. Aqui você define quando, onde e qual especialidade.</div>

      <div class="ag-top">
        <div class="ag-title"><span class="ag-badge">🩺</span>
          <div><h3>Agenda Médica</h3>

        <img class="ag-logo" src="${escAttr(LOGO)}" alt="Raguife">

        </div>
        <div class="ag-nav">
          <button onclick="window.__medMonth(-1)" aria-label="Mês anterior">‹</button>
          <b>${esc(monthLabelRH(ym))}</b>

        </div>
      </div>
      <div class="ag-grid">${cells}</div>
      ${!units.length ? '<div class="ag-empty">Nenhuma filial na base. Importe os funcionários com a coluna <b>Unidade</b> para poder cadastrar atendimentos.</div>' : ''}
      ${units.length && !mine.length ? `<div class="ag-empty">Nenhum atendimento em ${esc(monthLabelRH(ym))} para <b>${esc(S.medUnit)}</b>. Clique num dia para criar.</div>` : ''}
      <div class="ag-legend"><p class="lbl">Legenda das especialidades</p>
        ${DB.SPECIALTIES.map(sp => `<span class="ag-leg">
          <span class="ag-dot" style="background:${sp.color}"></span>${sp.icon} ${esc(sp.name)}</span>`).join('')}

const MONTHS_RH = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function monthLabelRH(ym) {
  const [y, m] = String(ym).split('-').map(Number);
  return `${MONTHS_RH[m - 1] || ''} ${y}`;
}
function medMonth(delta) {

  const d = new Date(y, m - 1 + delta, 1);
  S.medMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2,'0')}`;
  render();
}
function medUnit(u) { S.medUnit = u; render(); }
function newSlotOn(date) {

  const WD = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

      <div class="full"><label class="check"><input type="checkbox" id="sl-active" ${x.active !== false ? 'checked' : ''}> Visível para o funcionário</label></div>
    </div></div>
    <div class="modal-foot">
      ${x.id ? `<button class="btn danger" style="margin-right:auto" onclick="window.__delSlot('${x.id}')">Excluir</button>` : ''}
      <button class="btn line" onclick="window.__closeSlot()">Cancelar</button>
      <button class="btn" onclick="window.__saveSlot()">${isNew ? 'Criar atendimento(s)' : 'Salvar'}</button>
    </div></div></div>`;
}
async function saveSlot() {
  const g = i => document.getElementById(i);
  const isNew = !S.editingSlot.id;
  const common = {
    startTime: g('sl-start').value,
    endTime: g('sl-end').value,
    specialty: g('sl-spec').value,
    title: g('sl-title').value.trim(),
    professional: g('sl-prof').value.trim(),
    note: g('sl-note').value.trim(),
    active: g('sl-active').checked
  };
  if (common.startTime && common.endTime && common.endTime < common.startTime) {
    toast('O horário de fim é antes do início.'); return;
  }

  // --- Edição de um atendimento existente ---
  if (!isNew) {
    const data = { ...common, id: S.editingSlot.id, date: g('sl-date').value, unit: g('sl-unit').value };
    if (!data.date) { toast('Escolha a data.'); return; }
    if (!data.unit) { toast('Escolha a filial — sem ela ninguém vê esta data.'); return; }
    await DB.saveMedicalSlot(data);
    await DB.logAudit({ action: 'update', entity: 'medical_slot',
      detail: `${brDate(data.date)} · ${data.unit} · ${DB.slotLabel(data)}`, userEmail: S.user.email });
    S.editingSlot = null; S.medMonth = data.date.slice(0, 7); S.medUnit = data.unit;
    S.medical = await DB.listMedicalSlots();
    render(); toast('Atendimento salvo.'); return;
  }

  // --- Criação em lote: filiais × datas ---
  const selUnits = [...document.querySelectorAll('.sl-unit:checked')].map(e => e.value);
  if (!selUnits.length) { toast('Marque ao menos uma filial.'); return; }
  const from = g('sl-from').value;
  const to = g('sl-to').value;
  if (!from) { toast('Escolha a data "De".'); return; }
  const wds = [...document.querySelectorAll('.sl-wd:checked')].map(e => Number(e.value));

  const dates = [];
  if (!to || to === from) {
    dates.push(from);
  } else {
    if (to < from) { toast('"Até" está antes de "De".'); return; }
    if (!wds.length) { toast('Com "Até" preenchido, marque os dias da semana que se repetem.'); return; }
    let d = new Date(from + 'T00:00:00');
    const end = new Date(to + 'T00:00:00');
    while (d <= end) {
      if (wds.includes(d.getDay())) {
        dates.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`);
      }
      d.setDate(d.getDate() + 1);
    }
    if (!dates.length) { toast('Nenhuma data no período com esses dias da semana.'); return; }
  }

  const jobs = [];
  for (const unit of selUnits) for (const date of dates) jobs.push(DB.saveMedicalSlot({ ...common, date, unit }));
  await Promise.all(jobs);
  await DB.logAudit({ action: 'create', entity: 'medical_slot',
    detail: `${jobs.length} atendimento(s) · ${DB.slotLabel(common)}`, userEmail: S.user.email });
  S.editingSlot = null;
  S.medMonth = (dates[0] || from).slice(0, 7);
  S.medUnit = selUnits[0];
  S.medical = await DB.listMedicalSlots();
  render(); toast(`${jobs.length} atendimento(s) criado(s).`);
}
async function delSlot(sid) {
  const x = S.medical.find(y => y.id === sid);
  if (!confirm(`Excluir o atendimento de ${brDate(x?.date)} em ${x?.unit || '—'}?`)) return;
  await DB.deleteMedicalSlot(sid);
  await DB.logAudit({ action: 'delete', entity: 'medical_slot',
    detail: `${brDate(x?.date)} · ${x?.unit || ''}`, userEmail: S.user.email });
  S.medical = await DB.listMedicalSlots();
  render(); toast('Data excluída.');
}

    <div class="panel"><table>
      <thead><tr><th>Data/hora</th><th>Ação</th><th>Entidade</th><th>Detalhe</th><th>Usuário</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5"><div class="empty">Sem registros ainda.</div></td></tr>'}</tbody></table></div>`;
}

// ============================================================================
// Após render: carrega settings na primeira vez
// ============================================================================
async function postRender() {
  if (S.user && !S.settings) { S.settings = await DB.getSettings(); }
}

// --- Handlers globais (onclick inline) --------------------------------------
// ============================================================================
// Busca nas listas (atualiza só o corpo da tabela, sem perder o foco)
// ============================================================================
function empSearchSet(v) {
  S.empSearch = v;
  const el = document.getElementById('emp-tbody');
  if (el) el.innerHTML = employeeRows();
}
function benSearchSet(v) {
  S.benSearch = v;
  const el = document.getElementById('ben-tbody');
  if (el) el.innerHTML = benefitRows();
}

// ============================================================================
// Exportação para Excel (usa o SheetJS já carregado na página)
// ============================================================================
function downloadSheet(rows, sheetName, fileName) {
  if (typeof XLSX === 'undefined') { toast('Biblioteca de exportação não carregou. Recarregue a página.'); return; }
  if (!rows.length) { toast('Nada para exportar.'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, fileName);
}
function exportEmployees() {
  const rows = S.employees.map(e => ({
    Nome: e.name || '',
    CPF: e.cpfMasked || '',
    Perfil: (e.profileIds || []).map(profileName).join(', ') || e.profileRaw || '',
    Unidade: e.unit || '',
    Departamento: e.department || '',
    Cargo: e.role || ''
  }));
  downloadSheet(rows, 'Funcionários', 'funcionarios_raguife.xlsx');
  DB.logAudit({ action: 'export', entity: 'employees', userEmail: S.user.email, detail: `${rows.length} registros` });
}
function exportWinners(rid) {
  const r = S.viewingRaffle;
  const winners = (r && r._winners) || [];
  const rows = winners.map(w => ({
    Filme: w.filmTitle || '',
    Ganhador: w.employeeName || '',
    Voucher: w.voucherCode || ''
  }));
  downloadSheet(rows, 'Ganhadores', `ganhadores_${(r?.title || 'sorteio').replace(/\s+/g, '_').toLowerCase()}.xlsx`);
  DB.logAudit({ action: 'export', entity: 'raffle_winners', entityId: rid, userEmail: S.user.email, detail: `${rows.length} ganhadores` });
}

  __login: doLogin, __logout: doLogout, __tab: goTab,

  __benefitIcon: benefitIcon, __clearBenefitIcon: clearBenefitIcon,
  __benefitBanner: benefitBanner, __clearBenefitBanner: clearBenefitBanner, __addLink: addLink,
  __editProfile: editProfile, __closeProfile: () => { S.editingProfile = null; render(); },
  __saveProfile: saveProfile, __delProfile: delProfile,
  __editRule: editRule, __closeRule: () => { S.editingRule = null; render(); },
  __saveRule: saveRule, __delRule: delRule,
  __importDialog: importDialog, __closeImport: () => { S.importPreview = null; render(); },
  __importFile: importFile, __confirmImport: confirmImport,
  __editRaffle: editRaffle, __closeRaffle: () => { S.editingRaffle = null; render(); },
  __saveRaffle: saveRaffle, __delRaffle: delRaffle, __addFilm: addFilm,
  __viewRaffle: viewRaffle, __backRaffles: () => { S.viewingRaffle = null; render(); },
  __setRaffleStatus: setRaffleStatus, __draw: draw, __publish: publish,
  __saveSettings: saveSettings,
  __editSlot: editSlot, __saveSlot: saveSlot, __delSlot: delSlot,
  __medMonth: medMonth, __medUnit: medUnit, __newSlotOn: newSlotOn,
  __closeSlot: () => { S.editingSlot = null; render(); },
  __confirmReq: confirmReq, __closeReq: () => { S.confirmingRequest = null; render(); },
  __saveReq: saveReq, __delReq: delReq,
  __empSearch: empSearchSet, __benSearch: benSearchSet,
  __exportEmployees: exportEmployees, __exportWinners: exportWinners,
  __exportTemplate: exportTemplate,
  __editEmployee: editEmployee, __closeEmployee: () => { S.editingEmployee = null; render(); },
  __toggleEmpProfile: toggleEmpProfile, __saveEmployee: saveEmployee,
  __commUpload: commUpload, __commRemove: commRemove, __commSave: commSave
});


</script>
