<style>
/* ===========================================================================
   base.css — design tokens compartilhados (Funcionário + RH)
   Identidade Raguife: verde profundo + acento oliva, tipografia Bricolage/Inter.
   =========================================================================== */
:root{
  --bg:#eef5ec; --surface:#fff; --ink:#14241a; --muted:#647267; --line:#dce7db;
  --primary:#024f2b; --primary2:#0a6b3c; --soft:#e4f1e8;
  --accent:#739630; --accentSoft:#eef4e1;
  --bad:#c23a45; --badSoft:#fbeaeb; --warn:#b06b00; --warnSoft:#fff3d8;
  --ok:#1f7a4d; --okSoft:#e4f1e8;
  --shadow:0 12px 34px rgba(2,79,43,.10);
  --radius:16px;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}

/* Toast — usado nas duas áreas */
.toast{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);
  background:#14241a;color:#fff;border-radius:999px;padding:11px 15px;
  font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:60;
  box-shadow:0 10px 30px rgba(0,0,0,.25)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

nt:inherit;font-weight:900;margin-top:12px}.btn.secondary{background:var(--soft);color:var(--primary)}.btn.line{background:#fff;color:var(--primary);border:1px solid var(--line)}.error{display:none;background:var(--badSoft);color:var(--bad);border-radius:13px;padding:11px;margin-top:12px;font-size:13px;font-weight:800}.status{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px}.stat b{display:block;font-family:'Bricolage Grotesque';font-size:24px;line-height:1;color:var(--primary)}.stat span{font-size:11.5px;color:var(--muted);font-weight:800}.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}.section-title h2{font-family:'Bricolage Grotesque';font-size:20px;margin:0;color:var(--primary)}.pill{display:inline-flex;border-radius:999px;background:var(--accentSoft);color:var(--accent);font-size:11px;font-weight:900;padding:5px 9px;text-transform:uppercase}.search{position:relative;margin:0 0 12px}.search input{padding-left:38px}.search span{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}.cards{display:grid;gap:12px}.card{border:0;border-radius:22px;background:#fff;padding:16px;box-shadow:0 1px 0 rgba(2,79,43,.03),0 12px 25px rgba(2,79,43,.06);text-align:left;width:100%;color:var(--ink)}.benefit{position:relative;overflow:hidden;content-visibility:auto;contain-intrinsic-size:auto 120px}.benefit:after{content:"";position:absolute;right:-42px;top:-42px;width:128px;height:128px;border-radius:50%;background:rgba(2,79,43,.04)}.brow{display:flex;gap:12px;align-items:center;position:relative}.ico{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:26px;overflow:hidden;flex:none}.ico.contain{padding:5px;background:#fff!important;border:1px solid var(--line)}.ico.cover{padding:0}.ico img{display:block}.ico.contain img{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}.ico.cover img{width:100%;height:100%;object-fit:cover}.btitle{min-width:0;flex:1}.btitle h3{font-family:'Bricolage Grotesque';font-size:19px;margin:0;color:var(--ink)}.btitle span{font-size:12px;color:var(--muted);font-weight:800}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.badge{border-radius:999px;padding:4px 8px;font-size:10.5px;font-weight:900;background:var(--soft);color:var(--primary);text-transform:uppercase}.badge.warn{background:var(--warnSoft);color:var(--warn)}.benefit p{font-size:13.5px;color:var(--muted);margin:11px 0 0;position:relative}.go{position:absolute;right:15px;bottom:13px;color:var(--primary);font-weight:900}.empty{background:#fff;border:1px dashed var(--line);border-radius:18px;padding:24px;text-align:center;color:var(--muted);font-size:14px}.back{border:0;background:transparent;color:var(--primary);font-weight:900;margin:0 0 12px;padding:0}.detail-head{border-radius:24px;padding:18px;color:#fff;margin-bottom:14px;background:var(--primary)}.detail-head .ico{margin-bottom:10px}.detail-head h2{font-family:'Bricolage Grotesque';font-size:26px;margin:0;color:inherit}.detail-head span{font-size:12px;opacity:.85;font-weight:900;text-transform:uppercase}.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px}.box .lbl{font-size:11px;text-transform:uppercase;font-weight:900;letter-spacing:.06em;color:var(--accent);margin-bottom:6px}.box p{margin:0;color:var(--ink);font-size:14.5px;line-height:1.65;white-space:pre-line}.step{display:flex;gap:11px;margin:0 0 12px}.step i{width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--primary);display:grid;place-items:center;font-style:normal;font-weight:900;flex:none}.step span{font-size:14px;padding-top:3px}.link{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:8px;text-decoration:none;font-weight:800;font-size:14px}.link small{margin-left:auto;color:var(--muted)}.raffle{background:linear-gradient(135deg,#123d27,#0a6b3c);color:#fff;border-radius:24px;padding:16px;box-shadow:var(--shadow)}.raffle h2{font-family:'Bricolage Grotesque';font-size:23px;margin:0 0 5px}.raffle p{margin:0 0 12px;font-size:13px;opacity:.9}.film{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:12px;margin-bottom:8px}.film input{width:18px;height:18px;accent-color:#fff}.film b{display:block;font-size:14px}.film span{display:block;font-size:12px;opacity:.82}.raffle .btn{background:#fff;color:var(--primary)}.raffle .btn:disabled{opacity:.65}.result{background:#fff;color:var(--ink);border-radius:16px;padding:13px;margin-top:10px}.result.win{background:var(--accentSoft);color:var(--primary);font-weight:900}.voucher{display:flex;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:12px;color:var(--ink)}.voucher .stub{width:42px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center}.voucher .stub span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:2px;font-weight:900}.voucher .vbody{padding:12px;flex:1}.voucher b{font-family:'Bricolage Grotesque';font-size:18px}.voucher code{font-weight:900;color:var(--primary)}.privacy{font-size:12px;color:var(--muted);text-align:center;margin:22px 0 8px;line-height:1.5}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);background:#14241a;color:#fff;border-radius:999px;padding:11px 15px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:10}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:600px){.app{border-radius:28px;margin:18px auto;min-height:calc(100vh - 36px);overflow:hidden}.login{min-height:calc(100vh - 36px)}}

/* === Carteirinha do funcionário (cinema) === */
.idcta{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
  background:linear-gradient(100deg,#ffffff,#f3f8ef);border:1px solid var(--line);
  border-radius:16px;padding:14px 15px;margin-bottom:16px;box-shadow:var(--shadow)}
.idcta:active{transform:scale(.99)}
.idcta-ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;
  background:var(--accentSoft);border:1px solid #e0ebcf;flex:none}
.idcta-tx{flex:1;min-width:0}
.idcta-tx b{display:block;font-size:15px;color:var(--ink);font-family:var(--display)}
.idcta-tx span{font-size:12.5px;color:var(--muted)}
.idcta-go{color:var(--accent);font-size:20px;font-weight:800;flex:none}

.idcard{position:relative;overflow:hidden;border-radius:22px;padding:20px 20px 16px;
  color:#fff;background:linear-gradient(150deg,#035e34 0%,#024f2b 48%,#01371f 100%);
  box-shadow:0 18px 40px rgba(2,79,43,.32);min-height:228px;display:flex;flex-direction:column;
  margin:6px 0 12px}
.idcard-shine{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 110% -10%, rgba(115,150,48,.45), transparent 55%),
             linear-gradient(115deg, rgba(255,255,255,.12), transparent 40%)}
.idcard-watermark{position:absolute;right:-26px;bottom:-30px;width:200px;opacity:.07;pointer-events:none;filter:none}
.idcard>*{position:relative;z-index:1}
.idcard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:auto}
.idcard-logo{width:118px;height:auto}
.idcard-kind{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
  background:rgba(115,150,48,.9);color:#fff;padding:5px 10px;border-radius:999px}
.idcard-body{margin:18px 0 16px}
.idcard-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;
  color:rgba(255,255,255,.6);margin-bottom:3px}
.idcard-name{font-family:var(--display);font-size:25px;font-weight:800;line-height:1.1;
  letter-spacing:-.01em;word-break:break-word}
.idcard-grid{display:flex;gap:26px;margin-top:14px;flex-wrap:wrap}
.idcard-val{font-size:14px;font-weight:700;letter-spacing:.04em}
.idcard-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-top:13px;border-top:1px solid rgba(255,255,255,.18)}
.idcard-benefit{font-size:13px;font-weight:800}
.idcard-stamp{font-size:11px;font-weight:700;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.05em}
.idcard-hint{text-align:center;font-size:12.5px;color:var(--muted);margin:0 6px 8px;line-height:1.5}

/* Banner (imagem do Canva) no detalhe do benefício */
.benefit-banner{display:block;width:100%;height:auto;border-radius:14px;margin:0 0 14px;border:1px solid var(--line)}

/* === Filtro de categorias (funcionário) === */
.catbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:0 0 12px;-webkit-overflow-scrolling:touch}
.catbar::-webkit-scrollbar{height:0}
.catchip{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;
  padding:7px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.catchip.on{background:var(--primary);color:#fff;border-color:var(--primary)}

/* === Ajuste para app instalado (PWA) e telas estreitas === */
@media (max-width:480px){
  .app{margin:0 auto;min-height:100vh;border-radius:0}
  .head{border-radius:0 0 26px 26px}
}
/* respeita a área segura de baixo (barra de gestos do iPhone) */
.body{padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px))}
.login{padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}

/* === Selos Novo/Destaque + ênfase do card === */
.badge.new{background:var(--accentSoft);color:#4d6a13}
.badge.hot{background:#fff3d8;color:#b06b00}
.card.benefit.featured{box-shadow:0 1px 0 rgba(2,79,43,.04),0 14px 30px rgba(2,79,43,.10);
  outline:2px solid var(--accent);outline-offset:0}

/* === Pop-up de comunicado === */
.comm-overlay{position:fixed;inset:0;z-index:80;background:rgba(8,20,12,.62);display:flex;
  align-items:center;justify-content:center;padding:20px;
  padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
.comm-box{position:relative;width:min(440px,100%);max-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.comm-box img{width:100%;max-height:78vh;object-fit:contain;border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.4);background:#fff}
.comm-close{position:absolute;top:-12px;right:-6px;width:36px;height:36px;border-radius:50%;border:0;
  background:#fff;color:var(--ink);font-size:22px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.comm-ok{border:0;background:#fff;color:var(--primary);font:inherit;font-weight:800;
  border-radius:999px;padding:12px 28px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* validade do voucher */
.vvalid{display:inline-block;margin-top:4px;font-weight:800;color:var(--primary);font-size:13px}


/* === Esqueleto de carregamento (mostrado enquanto os dados chegam) === */
.skel{background:linear-gradient(90deg,#e6efe4 25%,#f2f7f0 50%,#e6efe4 75%);
  background-size:200% 100%;animation:skelmove 1.2s ease-in-out infinite;border-radius:8px}
@keyframes skelmove{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-line{height:12px;margin:7px 0}
.skel-line.sm{height:9px}
.skel-line.lg{height:20px}
.skel-ico{width:50px;height:50px;border-radius:16px;flex:none}
.skel-row{display:flex;gap:12px;align-items:center}
.skel-card{background:#fff;border-radius:22px;padding:16px;margin-bottom:12px;
  box-shadow:0 1px 0 rgba(2,79,43,.03),0 12px 25px rgba(2,79,43,.06)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* === Canal de ajuda no erro de login === */
.support-msg{margin:0}
.support-none{margin:6px 0 0;font-weight:700}
.support{display:flex;flex-direction:column;gap:8px;margin-top:11px}
.support a{display:flex;align-items:center;justify-content:center;gap:8px;
  background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;
  text-decoration:none;color:var(--primary);font-weight:800;font-size:14px}
.support a:active{background:var(--soft)}

/* === Bloco "Saúde e apoio" (topo da home) === */
.tiles-wrap{margin:0 0 4px}
.tiles-title{font-family:var(--display);font-size:15px;color:var(--primary);margin:0 0 9px;font-weight:800}
.tiles{display:grid;gap:9px}
.tiles.n1{grid-template-columns:1fr}.tiles.n2{grid-template-columns:repeat(2,1fr)}
.tiles.n3{grid-template-columns:repeat(3,1fr)}
.tiles.n4{grid-template-columns:repeat(2,1fr)}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;background:#fff;
  border:1px solid var(--line);border-radius:16px;padding:13px 7px;text-align:center;
  color:var(--ink);font:inherit;cursor:pointer;
  box-shadow:0 1px 0 rgba(2,79,43,.03),0 8px 18px rgba(2,79,43,.05)}
.tile:active{transform:scale(.98)}
.tile-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  font-size:20px;background:var(--accentSoft);border:1px solid #e0ebcf}
.tile.grey .tile-ic{background:#eef1ee;border-color:#dfe5df}
.tile b{font-size:11.5px;font-weight:800;line-height:1.3}

/* === Calendário de atendimentos === */
.cal{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav b{font-family:var(--display);font-size:17px;color:var(--primary)}
.cal-nav button{border:1px solid var(--line);background:#fff;color:var(--primary);width:36px;
  height:36px;border-radius:11px;font:inherit;font-weight:900;font-size:17px;cursor:pointer}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-wd{text-align:center;font-size:10px;font-weight:900;color:var(--muted);
  padding:3px 0 5px;text-transform:uppercase;letter-spacing:.04em}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:0;background:transparent;border-radius:11px;font:inherit;font-size:13.5px;color:var(--ink)}
.cal-cell.empty{visibility:hidden}
.cal-cell.has{background:var(--accentSoft);color:#3f5a10;font-weight:900;cursor:pointer}
.cal-cell.today{outline:2px solid var(--primary);outline-offset:-2px}
.cal-cell.on{background:var(--primary);color:#fff}
.cal-dots{display:flex;gap:2px;justify-content:center;min-height:5px}
.cal-dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.legend{display:flex;flex-wrap:wrap;gap:7px 14px;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:11px 13px;margin-bottom:12px}
.leg{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink)}
.leg-dot{width:9px;height:9px;border-radius:50%;flex:none}
.cal-legend{font-size:12px;color:var(--muted);margin:10px 0 0;text-align:center}

.apt{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:16px;padding:13px 14px;margin-bottom:9px}
.apt-d{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;
  color:var(--accent);margin-bottom:4px}
.apt b{display:block;font-size:15.5px;font-family:var(--display)}
.apt span{display:block;font-size:13px;color:var(--muted);margin-top:3px}

/* === Telas de apoio === */
.note{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;
  margin-bottom:12px;font-size:14px;line-height:1.6}
.big-link{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  background:var(--primary);color:#fff;border:0;border-radius:15px;padding:15px;
  font:inherit;font-weight:900;font-size:15px;text-decoration:none;margin-bottom:12px}
.seal{display:flex;gap:9px;align-items:flex-start;background:var(--accentSoft);border-radius:14px;
  padding:12px 13px;font-size:12.5px;line-height:1.55;color:#3f5a10;margin-bottom:12px}
.seal>span:first-child{flex:none}
.cvv{border-top:1px solid var(--line);margin-top:4px;padding-top:14px;font-size:13px;
  color:var(--muted);line-height:1.6}
.cvv b{color:var(--ink)}.cvv a{color:var(--primary);font-weight:800}

<script type="module">
// ============================================================================
// employee.js — Área do Funcionário (mobile-first).
// Núcleo compartilhado agora vive em firebase.js / utils.js / db.js / brand.js.
// Antes esses ~450 linhas eram COPIADAS aqui e no outro HTML, e as cópias já
// tinham divergido. Uma única fonte de verdade evita que isso volte a acontecer.
// ============================================================================

import { LOGO, LOGO_WHITE } from './brand.js';
import {
  CARD_COLORS, cpfSafe, dateOk, dateShort, digits, dt, esc, escAttr, firstName,
  formatText, isLightColor, isValidCpfLength, maskCpfInput, previewText, safeUrl, toast
} from './utils.js';
import {
  createEntry, getCommunication, getCurrentRaffle, getEmployeeByCpf,
  getEmployeeByHash, getMyEntries, getMyWinner, getSettings, listBenefits,
  listMedicalSlots, listProfiles, SPECIALTIES, specialtyOf, slotLabel,
  getMyMedicalRequest, createMedicalRequest
} from './db.js';





const HKEY = 'rgf_h'; // chave do hash no localStorage

// --- Estado da aplicação -----------------------------------------------------
const S = {
  settings: null, profiles: [], benefits: [],
  employee: null, raffle: null, myEntries: [], myWinner: null, comm: null,
  screen: 'home', openBenefitId: null, search: '', category: '',
  loading: false,  // true = dados ainda chegando; a home mostra esqueleto
  medical: [],     // atendimentos médicos (todas as filiais; filtramos ao exibir)
  calMonth: '',    // 'YYYY-MM' visível no calendário
  calDay: '',      // dia selecionado no calendário ('' = mês inteiro)
  myRequest: null, // meu pedido de agendamento (null = nenhum em aberto)
  schedPick: '',   // especialidade escolhida no formulário de agendamento
  schedReason: ''  // motivo digitado (preservado entre re-renders)
};

const root = () => document.getElementById('root');

// --- Inicialização -----------------------------------------------------------
async function init() {
  try {
    S.settings = await getSettings();
    document.title = `${S.settings.companyName} · ${S.settings.portalName}`;
    const savedHash = localStorage.getItem(HKEY);
    if (savedHash) {
      S.employee = await getEmployeeByHash(savedHash);
      if (S.employee) {
        // Pinta a home com esqueleto ANTES de buscar benefícios/sorteio: a pessoa
        // vê a estrutura da tela imediatamente em vez de um "Carregando…" mudo.
        S.loading = true; render();
        await afterLogin();
        S.loading = false;
      } else localStorage.removeItem(HKEY);
    }
    render();
    if (S.employee) maybeShowComm();
  } catch (e) {
    root().innerHTML = errorView(e);
  }
}

async function afterLogin() {
  localStorage.setItem(HKEY, S.employee.id);
  // Leituras independentes vão juntas (Promise.all) em vez de uma esperar a outra:
  // corta a latência do login, que no celular pesa bastante.
  const [profiles, benefits, comm, raffle, medical, myRequest] = await Promise.all([
    listProfiles(),
    listBenefits(),
    getCommunication().catch(() => null),
    getCurrentRaffle(),
    listMedicalSlots().catch(() => []),
    getMyMedicalRequest(S.employee.id).catch(() => null)
  ]);
  S.profiles = profiles;
  S.benefits = benefits;
  S.comm = comm;
  S.raffle = raffle;
  S.medical = medical;
  S.myRequest = myRequest;
  if (S.raffle) {
    // Estas duas dependem do sorteio, então rodam depois — mas em paralelo entre si.
    const [myEntries, myWinner] = await Promise.all([
      getMyEntries(S.raffle, S.employee.id),
      getMyWinner(S.raffle.id, S.employee.id)
    ]);
    S.myEntries = myEntries;
    S.myWinner = myWinner;
  } else {
    S.myEntries = []; S.myWinner = null;
  }
}

// --- Ações -------------------------------------------------------------------
// Formata o CPF enquanto a pessoa digita (o placeholder promete 000.000.000-00;
// antes o campo mostrava 11 dígitos crus e gerava insegurança sobre estar certo).
function maskCpfField(el) {
  el.value = maskCpfInput(el.value);
}

// Canal de ajuda configurado pelo RH em Configurações → Canal de ajuda.
function supportHTML() {
  const whats = digits(S.settings?.supportWhats || '');
  const mail = String(S.settings?.supportEmail || '').trim();
  if (!whats && !mail) return '<p class="support-none">Procure o RH/DP da sua unidade.</p>';
  const msg = encodeURIComponent('Olá! Não consegui entrar no ' +
    (S.settings?.portalName || 'Portal de Benefícios') + ' com meu CPF.');
  return '<div class="support">' +
    (whats ? `<a href="https://wa.me/${escAttr(whats)}?text=${msg}" target="_blank" rel="noopener">💬 Falar com o RH no WhatsApp</a>` : '') +
    (mail ? `<a href="mailto:${escAttr(mail)}">✉️ Enviar e-mail para o RH</a>` : '') +
    '</div>';
}

function showLoginError(msg, withSupport) {
  const err = document.getElementById('loginErr');
  if (!err) return;
  err.style.display = 'block';
  err.innerHTML = `<p class="support-msg">${esc(msg)}</p>` + (withSupport ? supportHTML() : '');
}
function resetLoginBtn() {
  const btn = document.getElementById('loginBtn');
  if (btn) { btn.disabled = false; btn.textContent = 'Entrar'; }
}

async function login() {
  const input = document.getElementById('cpf');
  const value = input.value;
  if (!isValidCpfLength(value)) {
    showLoginError('Faltam números. O CPF tem 11 dígitos.', false);
    input.focus();
    return;
  }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Entrando…';

  let emp;
  try {
    emp = await getEmployeeByCpf(value);
  } catch (_) {
    showLoginError('Não deu para conectar. Verifique sua internet e toque em Entrar de novo.', false);
    resetLoginBtn();
    return;
  }
  if (!emp) {
    showLoginError('Este CPF não está na base do portal. Quem resolve isso é o RH/DP:', true);
    resetLoginBtn();
    return;
  }

  // CPF aceito. Em vez de travar o botão em "Entrando…" durante as quatro
  // consultas do afterLogin(), já mostramos a home com esqueleto.
  S.employee = emp;
  S.screen = 'home';
  S.loading = true;
  render();
  window.scrollTo(0, 0);
  try {
    await afterLogin();
  } catch (err) {
    S.loading = false;
    root().innerHTML = errorView(err);
    return;
  }
  S.loading = false; S.medical = []; S.calMonth = ''; S.calDay = '';
  render();
  maybeShowComm();
}

function logout() {
  localStorage.removeItem(HKEY);
  S.employee = null; S.raffle = null; S.myEntries = []; S.myWinner = null;
  S.screen = 'home'; S.openBenefitId = null; S.search = ''; S.category = '';
  S.loading = false;
  render();
}

function setSearch(v) { S.search = v; renderCards(); }
function setCategory(c) { S.category = c; renderCatbar(); renderCards(); }
function openBenefit(bid) { S.openBenefitId = bid; S.screen = 'detail'; render(); window.scrollTo(0, 0); }
function goHome() { S.screen = 'home'; S.openBenefitId = null; render(); window.scrollTo(0, 0); }

async function joinRaffle() {
  if (!S.raffle) return;
  const checked = [...document.querySelectorAll('input[name="film"]:checked')].map(el => el.value);
  if (!checked.length) { toast('Marque ao menos um filme.'); return; }
  const enteredIds = new Set(S.myEntries.map(e => e.filmId));
  const wonSet = new Set((S.employee.wonFilms || []).map(t => String(t).trim().toLowerCase()));
  const toEnter = checked
    .filter(id => !enteredIds.has(id))
    .map(id => S.raffle.films.find(f => f.id === id))
    .filter(f => f && !wonSet.has(String(f.title).trim().toLowerCase()));
  if (!toEnter.length) { toast('Você já está inscrito nesses filmes.'); return; }
  try {
    for (const film of toEnter) await createEntry(S.raffle, film, S.employee);
    S.myEntries = await getMyEntries(S.raffle, S.employee.id);
    toast(toEnter.length > 1 ? `Inscrição registrada em ${toEnter.length} filmes!` : 'Inscrição registrada!');
    render();
  } catch (e) {
    toast('Não foi possível registrar. Tente novamente.');
  }
}

// --- Lógica de exibição de benefícios ---------------------------------------
function employeeProfileNames() {
  return (S.employee.profileIds || [])
    .map(pid => S.profiles.find(p => p.id === pid)?.name)
    .filter(Boolean);
}
function benefitVisible(b) {
  if (b.active === false) return false;
  if (!dateOk(b.startDate, b.endDate)) return false;
  // Filial: units vazio = todas as filiais; senão a unidade do funcionário
  // precisa casar (sem acento/maiúsculas). Sem unidade = não vê restritos a filial.
  if (Array.isArray(b.units) && b.units.length) {
    const nk = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    const my = nk(S.employee.unit);
    if (!my || !b.units.some(u => nk(u) === my)) return false;
  }
  if (!b.profileIds || !b.profileIds.length) return true; // sem restrição de perfil = todos
  return b.profileIds.some(pid => (S.employee.profileIds || []).includes(pid));
}
function myBenefits() {
  return S.benefits.filter(benefitVisible);
}
function categories() {
  return [...new Set(myBenefits().map(b => b.category).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b));
}
function filteredBenefits() {
  const q = S.search.toLowerCase().trim();
  const cat = S.category;
  return myBenefits().filter(b =>
    (!cat || b.category === cat) &&
    (!q || [b.name, b.category, b.description, b.responsible].join(' ').toLowerCase().includes(q)));
}

// --- Render ------------------------------------------------------------------
function render() {
  if (!S.employee) {
    root().innerHTML = loginView();
    setTimeout(() => document.getElementById('cpf')?.focus(), 20);
    return;
  }
  const view =
    S.screen === 'detail'  ? detailView()  :
    S.screen === 'card'    ? cardView()    :
    S.screen === 'medical' ? medicalView() :
    S.screen === 'schedule'? scheduleView():
    S.screen === 'psych'   ? psychView()   :
    S.screen === 'report'  ? reportView()  : homeView();
  root().innerHTML = shell(view);
}
function renderHomeBody() {
  const el = document.querySelector('.body');
  if (el && S.screen === 'home') el.innerHTML = homeBody();
}
function cardsHTML() {
  const benefits = filteredBenefits()
    .slice()
    .sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
  return benefits.length
    ? benefits.map(benefitCard).join('')
    : '<div class="empty">Nenhum benefício encontrado para este filtro.</div>';
}
function catbarHTML() {
  const cats = categories();
  if (cats.length < 2) return '';
  const chip = (val, label) =>
    `<button class="catchip ${S.category === val ? 'on' : ''}" onclick="window.__setCategory('${escAttr(val)}')">${esc(label)}</button>`;
  return chip('', 'Todos') + cats.map(c => chip(c, c)).join('');
}
function renderCards() {
  const el = document.getElementById('cards');
  if (el) el.innerHTML = cardsHTML();
}
function renderCatbar() {
  const el = document.getElementById('catbar');
  if (el) el.innerHTML = catbarHTML();
}

function iconHTML(b, cls = 'ico') {
  const fit = b.iconFit === 'cover' ? 'cover' : 'contain';
  const bg = CARD_COLORS[(b.color || 0) % CARD_COLORS.length];
  const light = isLightColor(bg);
  const inner = b.iconBase64
    ? `<img src="${escAttr(b.iconBase64)}" alt="" />`
    : esc(b.icon || '💸');
  const extra = light ? ';color:#14241a;border:1px solid var(--line)' : '';
  return `<div class="${cls} ${fit}" style="background:${bg}${extra}">${inner}</div>`;
}

function loginView() {
  return `<main class="login"><section class="login-card">
    <img id="loginLogo" src="${escAttr(LOGO)}" alt="${escAttr(S.settings.companyName)}">
    <h1>${esc(S.settings.portalName)}</h1>
    <p>Entre com seu CPF para ver seus benefícios e participar do sorteio do cinema.</p>
    <input class="field" id="cpf" inputmode="numeric" maxlength="14"
      placeholder="000.000.000-00" autocomplete="off"
      oninput="window.__maskCpf(this)"
      onkeydown="if(event.key==='Enter')window.__login()">
    <button class="btn" id="loginBtn" onclick="window.__login()">Entrar</button>
    <div id="loginErr" class="error"></div>
    <div class="privacy">${esc(S.settings.privacyText)}</div>
  </section></main>`;
}

function shell(content) {
  const names = employeeProfileNames().join(', ') || 'Perfil não informado';
  return `<div class="app">
    <header class="head">
      <div class="brand">
        <img src="${escAttr(LOGO_WHITE)}" alt="${escAttr(S.settings.companyName)}">
        <div><b>${esc(S.settings.portalName)}</b><span>Consulta do colaborador</span></div>
      </div>
      <div class="hello">
        <div>
          <h1>Olá, ${esc(firstName(S.employee.name))}</h1>
          <p>CPF ${esc(S.employee.cpfMasked || cpfSafe('0'))} · ${esc(names)}</p>
        </div>
        <button class="logout" onclick="window.__logout()">Sair</button>
      </div>
    </header>
    <main class="body">${content}</main>

}

function homeView() { return homeBody(); }

  const card = `<div class="skel-card">
    <div class="skel-row"><div class="skel skel-ico"></div>
      <div style="flex:1"><div class="skel skel-line lg" style="width:64%"></div>
        <div class="skel skel-line sm" style="width:34%"></div></div></div>
    <div class="skel skel-line" style="width:94%;margin-top:14px"></div>
    <div class="skel skel-line" style="width:71%"></div></div>`;
  return `<div role="status" aria-live="polite">
    <span class="sr-only">Carregando seus benefícios.</span>
    <div class="status">
      <div class="stat"><div class="skel skel-line lg" style="width:42%"></div>
        <div class="skel skel-line sm" style="width:86%"></div></div>
      <div class="stat"><div class="skel skel-line lg" style="width:42%"></div>
        <div class="skel skel-line sm" style="width:86%"></div></div>

    ${helpTiles()}

      <div class="stat"><b>${total}</b><span>benefícios disponíveis</span></div>
      <div class="stat"><b>${S.raffle && S.raffle.status !== 'draft' ? '1' : '0'}</b><span>sorteio na semana</span></div>
    </div>
    <div class="section-title"><h2>Benefícios</h2><span class="pill">Seu perfil</span></div>
    <div class="search"><span>🔎</span>
      <input class="field" value="${escAttr(S.search)}" placeholder="Buscar benefício"
        oninput="window.__setSearch(this.value)"></div>
    <div class="catbar" id="catbar">${catbarHTML()}</div>
    <div class="cards" id="cards">${cardsHTML()}</div>

}

function benefitCard(b) {
  const badges = [];
  if (b.isNew) badges.push('<span class="badge new">Novo</span>');
  if (b.featured) badges.push('<span class="badge hot">★ Destaque</span>');
  if (b.actionRequired) badges.push('<span class="badge warn">Ação necessária</span>');
  if (b.endDate) badges.push(`<span class="badge">Até ${esc(dateShort(b.endDate))}</span>`);
  const desc = previewText(b.description || '');
  return `<button class="card benefit${b.featured ? ' featured' : ''}" onclick="window.__openBenefit('${b.id}')">
    <div class="brow">${iconHTML(b)}
      <div class="btitle"><h3>${esc(b.name)}</h3><span>${esc(b.category)}</span></div></div>
    ${badges.length ? `<div class="badges">${badges.join('')}</div>` : ''}
    <p>${esc(desc.slice(0, 120))}${desc.length > 120 ? '…' : ''}</p>
    <div class="go">→</div></button>`;
}

function detailView() {
  const b = S.benefits.find(x => x.id === S.openBenefitId);
  if (!b) return homeBody();
  const bg = CARD_COLORS[(b.color || 0) % CARD_COLORS.length];

  return `<button class="back" onclick="window.__goHome()">← Voltar</button>
    <section class="detail-head" style="${headStyle}">
      ${iconHTML(b)}<span>${esc(b.category)}</span><h2>${esc(b.name)}</h2></section>
    ${b.bannerBase64 ? `<img class="benefit-banner" src="${escAttr(b.bannerBase64)}" alt="" loading="lazy" decoding="async">` : ''}
    <section class="box"><div class="lbl">Resumo</div>
      <p>${formatText(b.description || 'Sem descrição cadastrada.')}</p></section>
    ${b.details ? `<section class="box"><div class="lbl">Regras</div><p>${formatText(b.details)}</p></section>` : ''}
    ${b.responsible ? `<section class="box"><div class="lbl">Dúvidas com</div><p>${esc(b.responsible)}</p></section>` : ''}

// ============================================================================
// SAÚDE E APOIO — atalhos fixos no topo da home.
// Cada atalho só aparece se o RH configurou o recurso correspondente.
// ============================================================================
const WEEKDAYS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
  'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

// Hoje em 'YYYY-MM-DD' pelo relógio LOCAL. Não usar toISOString(): ele converte
// para UTC e, à noite no Brasil, devolve o dia seguinte.
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function monthOf(key) { return String(key || '').slice(0, 7); }
function shiftMonth(ym, delta) {
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function monthLabel(ym) {
  const [y, m] = ym.split('-').map(Number);
  const nm = MONTHS[m - 1] || '';
  return nm.charAt(0).toUpperCase() + nm.slice(1) + ' ' + y;
}
function dayLabel(key) {
  const [y, m, d] = String(key).split('-').map(Number);
  if (!y) return '';
  return `${WEEKDAYS[new Date(y, m - 1, d).getDay()]} · ${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}`;
}

// Atendimentos da MINHA filial. Sem unidade cadastrada, não há o que mostrar.
function myMedicalSlots() {
  const nk = v => String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  const my = nk(S.employee?.unit);
  if (!my) return [];
  return (S.medical || []).filter(x => x.active && x.unit && nk(x.unit) === my);
}
function medicalAvailable() {
  return !!(myMedicalSlots().length || safeUrl(S.settings?.medicalBookingUrl));
}

function helpTiles() {
  const t = [];
  const tile = (screen, ic, label, cls) =>
    `<button class="tile ${cls || ''}" onclick="window.__openScreen('${screen}')">
      <span class="tile-ic">${ic}</span><b>${label}</b></button>`;
  t.push(tile('schedule', '🗓️', 'Agendar<br>atendimento'));
  if (medicalAvailable()) t.push(tile('medical', '🩺', 'Agenda<br>médica'));
  if (digits(S.settings?.psychWhats || '')) t.push(tile('psych', '💚', 'Apoio<br>psicológico'));
  if (safeUrl(S.settings?.reportUrl)) t.push(tile('report', '🔒', 'Canal de<br>denúncias', 'grey'));
  if (!t.length) return '';
  return `<div class="tiles-wrap"><p class="tiles-title">Saúde e apoio</p>
    <div class="tiles n${t.length}">${t.join('')}</div></div>`;
}

// --- Agenda médica -----------------------------------------------------------
function medicalView() {
  const st = S.settings || {};
  const slots = myMedicalSlots();
  const ym = S.calMonth || monthOf(todayKey());
  const book = safeUrl(st.medicalBookingUrl);
  const head = `<button class="back" onclick="window.__goHome()">← Voltar</button>
    <section class="detail-head" style="background:#0d7d6b">
      <div class="ico" style="background:rgba(255,255,255,.16)">🩺</div>
      <span>${esc(S.employee?.unit || 'Sua unidade')}</span><h2>Agenda médica</h2></section>`;

  if (!String(S.employee?.unit || '').trim()) {
    return head + `<div class="empty">Sua unidade não está cadastrada, então não dá para
      mostrar as datas certas. Quem ajusta isso é o RH/DP:</div>` + supportHTML();
  }

  const monthSlots = slots.filter(x => monthOf(x.date) === ym);
  const byDay = {};
  monthSlots.forEach(x => { (byDay[x.date] = byDay[x.date] || []).push(x); });

  const [Y, M] = ym.split('-').map(Number);
  const firstWd = new Date(Y, M - 1, 1).getDay();
  const nDays = new Date(Y, M, 0).getDate();
  const today = todayKey();

  let cells = WEEKDAYS.map(w => `<div class="cal-wd">${w}</div>`).join('');
  for (let i = 0; i < firstWd; i++) cells += '<div class="cal-cell empty"></div>';
  for (let d = 1; d <= nDays; d++) {
    const key = `${Y}-${String(M).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const n = (byDay[key] || []).length;
    const cls = ['cal-cell', n ? 'has' : '', key === today ? 'today' : '',
      S.calDay === key ? 'on' : ''].filter(Boolean).join(' ');
    const dots = (byDay[key] || []).slice(0, 3)
      .map(x => `<span class="cal-dot" style="background:${specialtyOf(x.specialty).color}"></span>`).join('');
    cells += n
      ? `<button class="${cls}" onclick="window.__calDay('${key}')"
          aria-label="Dia ${d}, ${n} atendimento${n > 1 ? 's' : ''}">${d}<span class="cal-dots">${dots}</span></button>`
      : `<div class="${cls}">${d}<span class="cal-dots"></span></div>`;
  }

  const shown = S.calDay && byDay[S.calDay] ? byDay[S.calDay] : monthSlots;
  const list = shown.length
    ? shown.map(x => {
        const sp = specialtyOf(x.specialty);
        return `<div class="apt" style="border-left-color:${sp.color}">
        <div class="apt-d" style="color:${sp.color}">${esc(dayLabel(x.date))}${x.startTime ? ' · ' + esc(x.startTime) : ''}${x.endTime ? ' às ' + esc(x.endTime) : ''}</div>
        <b>${sp.icon} ${esc(slotLabel(x))}</b>
        ${x.professional ? `<span>${esc(x.professional)}</span>` : ''}
        ${x.note ? `<span>${esc(x.note)}</span>` : ''}</div>`; }).join('')
    : `<div class="empty">Nenhum atendimento marcado em ${esc(monthLabel(ym))} na sua unidade.
        Use as setas para ver outros meses.</div>`;

  return head + `
    <div class="cal">
      <div class="cal-nav">
        <button onclick="window.__calShift(-1)" aria-label="Mês anterior">‹</button>
        <b>${esc(monthLabel(ym))}</b>
        <button onclick="window.__calShift(1)" aria-label="Próximo mês">›</button>
      </div>
      <div class="cal-grid">${cells}</div>
      ${monthSlots.length ? '<p class="cal-legend">Toque num dia marcado para ver só ele.</p>' : ''}
    </div>
    ${monthSlots.length ? `<div class="legend">${
      [...new Set(monthSlots.map(x => x.specialty))].map(sid => {
        const sp = specialtyOf(sid);
        return `<span class="leg"><span class="leg-dot" style="background:${sp.color}"></span>${esc(sp.name)}</span>`;
      }).join('')}</div>` : ''}
    ${S.calDay ? `<button class="btn line" style="margin:0 0 12px" onclick="window.__calDay('${S.calDay}')">Ver o mês inteiro</button>` : ''}
    ${list}
    ${book ? `<a class="big-link" href="${escAttr(book)}" target="_blank" rel="noopener">📅 Agendar atendimento</a>` : ''}
    ${st.medicalNote ? `<div class="note">${formatText(st.medicalNote)}</div>` : ''}`;
}

// --- Agendamento de atendimento ----------------------------------------------
// O funcionário já está logado (S.employee), então não pede CPF de novo.
// Sem pedido em aberto -> formulário. Com pedido -> mostra o status/confirmação.
function schedDatePt(iso) {
  const p = String(iso || '').split('-');
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : '';
}
function scheduleView() {
  const head = `<button class="back" onclick="window.__goHome()">← Voltar</button>
    <section class="detail-head" style="background:#0d7d6b">
      <div class="ico" style="background:rgba(255,255,255,.16)">🗓️</div>
      <span>${esc(S.employee?.name || 'Colaborador')}</span><h2>Agendar atendimento</h2></section>`;

  const r = S.myRequest;
  if (r) {
    const sp = specialtyOf(r.specialty);
    const confirmed = r.status === 'confirmado';
    const when = confirmed ? `${schedDatePt(r.date)}${r.startTime ? ' · ' + esc(r.startTime) : ''}` : '';
    return head + `
      <div class="apt" style="border-left-color:${sp.color}">
        <div class="apt-d" style="color:${sp.color}">${sp.icon} ${esc(sp.name)} · ${confirmed ? '✓ Confirmado' : '⏳ Aguardando o RH'}</div>
        ${r.reason ? `<span>Motivo: ${esc(r.reason)}</span>` : ''}
        ${confirmed ? `<b style="font-size:19px;margin-top:6px;display:block">📅 ${esc(when)}</b>` : ''}
        ${confirmed && r.place ? `<span>Local: ${esc(r.place)}</span>` : ''}
        ${confirmed && r.rhNote ? `<span>${esc(r.rhNote)}</span>` : ''}
      </div>
      <div class="note">${confirmed
        ? 'Pronto! Guarde a data. Se precisar mudar, procure o RH/DP.'
        : 'Seu pedido foi enviado e está aguardando o RH definir a data. Volte aqui para ver a confirmação.'}</div>`;
  }

  const base = 'display:flex;align-items:center;gap:9px;width:100%;padding:12px 14px;margin-bottom:8px;border:1.5px solid #e2e8f0;border-radius:12px;background:#fff;font-size:15px;font-weight:600;color:#0f172a;text-align:left;cursor:pointer';
  const specs = SPECIALTIES.map(sp => {
    const on = S.schedPick === sp.id;
    const style = on ? base + `;border-color:${sp.color};background:${sp.color}12;color:${sp.color};border-width:2px` : base;
    return `<button style="${style}" onclick="window.__schedPick('${sp.id}')"><span style="font-size:18px">${sp.icon}</span> ${esc(sp.name)}</button>`;
  }).join('');

  return head + `
    <p class="tiles-title" style="margin:2px 2px 8px">Escolha a especialidade</p>
    <div>${specs}</div>
    <label style="display:block;margin:16px 2px 6px;font-weight:700;font-size:14px">Motivo do atendimento</label>
    <textarea class="field" id="sched-reason" style="width:100%;min-height:96px;padding:12px 14px;border-radius:12px;border:1.5px solid #e2e8f0;font-size:15px;font-family:inherit" placeholder="Descreva o que você precisa (sintomas, exame, retorno…).">${esc(S.schedReason || '')}</textarea>
    <button class="btn" style="margin-top:14px" onclick="window.__schedSend()">Enviar pedido</button>
    <div class="note">Depois de enviar, o RH define a data e o horário. Você acompanha por aqui.</div>`;
}
function schedPick(sid) {
  const ta = document.getElementById('sched-reason');
  if (ta) S.schedReason = ta.value;
  S.schedPick = sid; render(); window.scrollTo(0, 0);
}
async function schedSend() {
  const ta = document.getElementById('sched-reason');
  const reason = (ta ? ta.value : '').trim();
  if (!S.schedPick) { toast('Escolha a especialidade.'); return; }
  if (!reason) { toast('Descreva o motivo do atendimento.'); return; }
  try {
    const res = await createMedicalRequest(S.employee, S.schedPick, reason);
    S.myRequest = res.request ? { ...res.request } : await getMyMedicalRequest(S.employee.id);
    S.schedPick = ''; S.schedReason = '';
    render(); window.scrollTo(0, 0);
    toast('Pedido enviado!');
  } catch (e) {
    toast('Não consegui enviar agora. Tente de novo.');
  }
}

// --- Apoio psicológico -------------------------------------------------------

// é a pessoa, não o portal.

  const st = S.settings || {};

    <section class="detail-head" style="background:#1f7a4d">
      <div class="ico" style="background:rgba(255,255,255,.16)">💚</div>
      <span>Apoio</span><h2>Apoio psicológico</h2></section>
    ${st.psychName ? `<div class="note"><b>${esc(st.psychName)}</b></div>` : ''}

// --- Navegação das telas de apoio -------------------------------------------
function openScreen(name) {
  if (name === 'medical') { S.calMonth = monthOf(todayKey()); S.calDay = ''; }
  S.screen = name; render(); window.scrollTo(0, 0);
}
function calShift(delta) {
  S.calMonth = shiftMonth(S.calMonth || monthOf(todayKey()), delta);
  S.calDay = ''; render();
}
function calDay(key) { S.calDay = (S.calDay === key ? '' : key); render(); }

function cardAllowed() {
  if (!S.settings || S.settings.cardEnabled === false) return false;
  const ids = S.settings.cardProfileIds || [];
  if (!ids.length) return true; // vazio = todos os perfis
  return (S.employee.profileIds || []).some(pid => ids.includes(pid));
}
function openCard() {
  if (!cardAllowed()) { toast('Carteirinha indisponível para o seu perfil.'); return; }
  S.screen = 'card'; render(); window.scrollTo(0, 0);
}
function monthYear() {
  const s = new Date().toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function cardView() {
  const e = S.employee;
  const names = employeeProfileNames().join(', ');
  return `<button class="back" onclick="window.__goHome()">← Voltar</button>
    <div class="idcard">
      <div class="idcard-shine"></div>
      <img class="idcard-watermark" src="${escAttr(LOGO_WHITE)}" alt="">
      <div class="idcard-top">
        <img class="idcard-logo" src="${escAttr(LOGO_WHITE)}" alt="Raguife">
        <span class="idcard-kind">Funcionário(a)</span>
      </div>
      <div class="idcard-body">
        <div class="idcard-label">Nome</div>
        <div class="idcard-name">${esc(e.name || '—')}</div>
        <div class="idcard-grid">
          <div><div class="idcard-label">CPF</div>
            <div class="idcard-val">${esc(e.cpfMasked || cpfSafe('0'))}</div></div>
          ${names ? `<div><div class="idcard-label">Perfil</div>
            <div class="idcard-val">${esc(names)}</div></div>` : ''}
        </div>
      </div>
      <div class="idcard-foot">
        <span class="idcard-benefit">${esc(S.settings?.cardLabel || '')}</span>
        <span class="idcard-stamp">${esc(monthYear())}</span>
      </div>
    </div>
    ${S.settings?.cardHint ? `<p class="idcard-hint">${esc(S.settings.cardHint)}</p>` : ''}`;
}

function linkIcon(url) {
  const u = String(url || '').toLowerCase();
  if (u.includes('pdf')) return '📄';
  if (u.includes('wa.me') || u.includes('whatsapp')) return '💬';
  if (u.includes('youtube')) return '▶️';
  return '🔗';
}

// --- Card do sorteio ---------------------------------------------------------
function raffleOpen(r) {
  return r && r.status === 'open' && dateOk(r.startAt, r.endAt);
}
function raffleCard() {
  const r = S.raffle;
  if (!r || r.status === 'draft') return '';
  const title = esc(r.title || 'Sorteio do Cinema');

  // Resultado publicado
  if (r.status === 'published') {
    if (S.myWinner) {
      const fmtD = s => { const p = String(s || '').split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : ''; };
      const ini = fmtD(r.voucherStart), fim = fmtD(r.voucherEnd);
      const validade = ini && fim ? `Válido de ${ini} a ${fim}`
        : ini ? `Válido a partir de ${ini}`
        : fim ? `Válido até ${fim}` : '';
      return `<section class="raffle"><h2>${title}</h2><p>Resultado publicado.</p>
        <div class="result win">🎉 Você foi contemplado: ${esc(S.myWinner.filmTitle)}</div>
        <div class="voucher"><div class="stub"><span>CINEMA</span></div>
          <div class="vbody"><b>${esc(S.myWinner.filmTitle)}</b><br>
            <span>Código: <code>${esc(S.myWinner.voucherCode)}</code></span><br>
            ${validade ? `<span class="vvalid">🗓️ ${esc(validade)}</span><br>` : ''}
            <small>Apresente este voucher conforme orientação do RH/DP.</small></div></div></section>`;
    }
    return `<section class="raffle"><h2>${title}</h2><p>Resultado publicado.</p>
      <div class="result">Dessa vez você não foi contemplado. Boa sorte na próxima!</div></section>`;
  }

  const enteredIds = new Set(S.myEntries.map(e => e.filmId));
  const enteredTitles = S.myEntries.map(e => e.filmTitle).filter(Boolean);

  // Inscrições fechadas / sorteado (ainda não publicado)
  if (!raffleOpen(r)) {
    if (enteredIds.size) {
      return `<section class="raffle"><h2>${title}</h2>
        <p>Inscrições encerradas. Você está concorrendo — aguarde o resultado.</p>
        <div class="result win">✅ Inscrito em: ${esc(enteredTitles.join(', '))}</div></section>`;
    }
    return `<section class="raffle"><h2>${title}</h2>
      <p>As inscrições não estão abertas neste momento.</p>
      <div class="result">Período: ${r.startAt ? esc(dt(r.startAt)) : 'a definir'} até ${r.endAt ? esc(dt(r.endAt)) : 'a definir'}</div></section>`;
  }

  // Inscrições abertas — marcar um ou vários filmes
  const films = (r.films || []).filter(f => f.active !== false);
  const wonSet = new Set((S.employee.wonFilms || []).map(t => String(t).trim().toLowerCase()));
  const canPick = films.filter(f => !enteredIds.has(f.id) && !wonSet.has(String(f.title).trim().toLowerCase()));
  const intro = enteredIds.size
    ? 'Você já está inscrito nos filmes marcados. Pode marcar mais e confirmar.'
    : 'Marque um ou mais filmes e confirme. Você concorre em todos, mas leva no máximo um prêmio.';
  return `<section class="raffle"><h2>${title}</h2>
    <p>${intro}</p>
    ${films.map(f => {
      const entered = enteredIds.has(f.id);
      const won = wonSet.has(String(f.title).trim().toLowerCase());
      const disabled = entered || won;
      const note = won ? 'Você já ganhou este filme' : entered ? 'Inscrito ✓' : `${Number(f.quantity || 0)} ingresso(s)`;
      return `<label class="film" ${won ? 'style="opacity:.5"' : ''}>
        <input type="checkbox" name="film" value="${escAttr(f.id)}" ${entered ? 'checked' : ''} ${disabled ? 'disabled' : ''}>
        <div><b>${esc(f.title)}</b><span>${note}</span></div></label>`;
    }).join('')}
    ${canPick.length
      ? `<button class="btn" onclick="window.__joinRaffle()">${enteredIds.size ? 'Confirmar inscrições' : 'Quero participar'}</button>`
      : '<div class="result win">✅ Você está inscrito em todos os filmes disponíveis.</div>'}
  </section>`;
}

function errorView(e) {
  const msg = String(e && e.message ? e.message : e).slice(0, 200);
  return `<main class="login"><section class="login-card">
    <h1>Não foi possível carregar</h1>
    <p>Verifique sua conexão e tente novamente. Se persistir, procure o RH/DP.</p>
    <p style="font-size:12px;color:var(--bad);margin-top:8px">Detalhe: ${esc(msg)}</p>
  </section></main>`;
}

// Mostra o comunicado (arte) uma única vez por versão, neste dispositivo.
function maybeShowComm() {
  const c = S.comm;
  if (!c || !c.active || !c.imageBase64 || !c.id) return;
  if (localStorage.getItem('rgf_comm_seen') === c.id) return;
  const wrap = document.createElement('div');
  wrap.className = 'comm-overlay';
  wrap.innerHTML = `<div class="comm-box">
    <button class="comm-close" aria-label="Fechar">×</button>
    <img src="${escAttr(c.imageBase64)}" alt="Comunicado">
    <button class="comm-ok">Entendi</button>
  </div>`;
  const close = () => { try { localStorage.setItem('rgf_comm_seen', c.id); } catch (e) {} wrap.remove(); };
  wrap.addEventListener('click', e => { if (e.target === wrap) close(); });
  wrap.querySelector('.comm-close').onclick = close;
  wrap.querySelector('.comm-ok').onclick = close;
  document.body.appendChild(wrap);
}

init();


</script>
